<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>French Phrases</title>

  <style>
    body { font-family: -apple-system, sans-serif; padding: 15px; background: #f4f4f9; margin: 0; }
    
    .header-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    h2 { 
      color: #333; 
      font-size: 26px; 
      margin: 0;
      user-select: none;
    }

    .sync-btn {
      background: #e2e8f0;
      border: none;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .sync-btn:active {
      transform: scale(0.9);
      background: #cbd5e1;
    }

    .add-phrase-container {
      display: flex;
      gap: 8px;
      justify-content: center;
      max-width: 400px;
      margin: 0 auto 20px auto;
    }

    .add-phrase-container input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    .add-phrase-container button {
      padding: 10px 16px;
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .add-phrase-container button:active {
      opacity: 0.8;
    }    

    .card { 
      position: relative;
      background: white; 
      padding: 18px 40px 18px 18px;
      margin-bottom: 12px; 
      border-radius: 12px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.08); 
      cursor: pointer; 
    }
    .card:active { background: #e0f2fe; }

    .delete-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 26px;
      height: 26px;
      line-height: 24px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      color: #94a3b8;
      background: #f1f5f9;
      border-radius: 50%;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .delete-btn:active {
      background: #ef4444;
      color: white;
    }

    .french { font-size: 21px; font-weight: bold; color: #1e3a8a; margin-bottom: 5px; }
    .english { font-size: 16px; color: #64748b; }
  </style>
</head>
<body>

  <div class="header-container">
    <h2>🇫🇷 French Phrases</h2>
    <button class="sync-btn" id="syncBtn" onclick="syncWithCloud()" title="Sync from Google Sheet">🔄</button>
  </div>

  <div class="add-phrase-container">
    <input type="text" id="phraseInput" placeholder="Enter new phrase..." />
    <button id="addBtn" onclick="handleAddPhrase()">Translate & Add</button>
  </div>

  <div id="list"></div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyFm4CMsRhjso3PoojdVf1X3ucuBdiznvcfNrcbEmqrnaoRYkOcn5vWbPOGYjaT4BLy/exec';
    let frenchVoice = null;
    let localPhrases = [];

    function loadVoices() {
      if ('speechSynthesis' in window) {
        let voices = window.speechSynthesis.getVoices();
        let frVoices = voices.filter(v => v.lang.startsWith('fr'));
        
        frenchVoice = frVoices.find(v => v.name.includes('Thomas')) || 
                      frVoices.find(v => v.name.includes('Nicolas')) || 
                      frVoices.find(v => v.lang === 'fr-FR') ||
                      frVoices[0];
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    function renderCards(phrases) {
      const container = document.getElementById('list');
      container.innerHTML = '';

      if (!phrases || phrases.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">No phrases saved. Add one above!</div>';
        return;
      }

      phrases.forEach((item, index) => {
        let card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="delete-btn" onclick="deletePhrase(event, ${index})">✕</div>
          <div class="french">${escapeHtml(item.french)}</div>
          <div class="english">${escapeHtml(item.english)}</div>
        `;
        card.onclick = function() { speakFrench(item.french); };
        container.appendChild(card);
      });
    }

async function deletePhrase(event, index) {
  event.stopPropagation();

  const itemToDelete = localPhrases[index];

  // 1. Remove locally immediately for instant feedback
  localPhrases.splice(index, 1);
  saveToLocalStorage(localPhrases);
  renderCards(localPhrases);

  // 2. Send request to delete from Google Sheets in the background
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        action: 'delete',
        english: itemToDelete.english,
        french: itemToDelete.french
      })
    });
  } catch (e) {
    console.error('Failed to sync deletion with Google Sheet', e);
  }
}

    function saveToLocalStorage(phrases) {
      try {
        localStorage.setItem('saved_french_phrases', JSON.stringify(phrases));
      } catch (e) {
        console.error('Could not save to localStorage', e);
      }
    }

    async function initData() {
      const stored = localStorage.getItem('saved_french_phrases');
      
      if (stored) {
        try {
          localPhrases = JSON.parse(stored);
          renderCards(localPhrases);
          return;
        } catch (e) {
          console.error('Error parsing local storage');
        }
      }

      // If storage is totally empty, pull from Google Sheet
      syncWithCloud();
    }

    async function syncWithCloud() {
      const syncBtn = document.getElementById('syncBtn');
      syncBtn.style.transform = 'rotate(360deg)';
      syncBtn.style.transition = 'transform 0.6s ease';

      try {
        const response = await fetch(SCRIPT_URL + '?t=' + Date.now(), { method: 'GET', redirect: 'follow' });
        const remoteData = await response.json();

        if (Array.isArray(remoteData)) {
          // Cloud returns newest at bottom, so reverse for display
          localPhrases = remoteData.reverse();
          saveToLocalStorage(localPhrases);
          renderCards(localPhrases);
        }
      } catch (err) {
        alert('Could not sync with Google Sheets. Check connection.');
      } finally {
        setTimeout(() => {
          syncBtn.style.transform = 'none';
          syncBtn.style.transition = 'none';
        }, 600);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    async function handleAddPhrase() {
      const input = document.getElementById('phraseInput');
      const phrase = input.value.trim();
      
      if (!phrase) return;

      const btn = document.getElementById('addBtn');
      btn.innerText = 'Translating...';
      btn.disabled = true;

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ phrase: phrase })
        });

        const result = await response.json();

        if (result.status === 'success') {
          const newCard = { english: result.english, french: result.french };

          localPhrases.unshift(newCard);
          saveToLocalStorage(localPhrases);
          renderCards(localPhrases);

          input.value = '';
        } else {
          alert('Translation error: ' + (result.message || 'Unknown error'));
        }

      } catch (error) {
        alert('Failed to connect to translation server.');
      } finally {
        btn.innerText = 'Translate & Add';
        btn.disabled = false;
      }
    }

    function speakFrench(text) {
      if (!text) return;

      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.nativeSpeak) {
        window.webkit.messageHandlers.nativeSpeak.postMessage(text);
        return;
      }

      if (!('speechSynthesis' in window)) return;
      if (!frenchVoice) loadVoices();

      window.speechSynthesis.cancel();
      let utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'fr-FR';
      utterance.rate = 0.88;
      utterance.pitch = 0.95;

      if (frenchVoice) {
        utterance.voice = frenchVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    initData();
  </script>
</body>
</html>
