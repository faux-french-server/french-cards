<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>French Phrases</title>

  <style>
    body { font-family: -apple-system, sans-serif; padding: 15px; background: #f4f4f9; margin: 0; }
    
    h2 { 
      text-align: center; 
      color: #333; 
      font-size: 26px; 
      margin-top: 10px; 
      margin-bottom: 20px;
      user-select: none;
    }

    .add-phrase-container {
      display: flex;
      gap: 8px;
      justify-content: center;
      max-width: 400px;
      margin: 0 auto 20px auto;
    }

    .add-phrase-container input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    .add-phrase-container button {
      padding: 10px 16px;
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .add-phrase-container button:active {
      opacity: 0.8;
    }    

    .card { background: white; padding: 18px; margin-bottom: 12px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); cursor: pointer; }
    .card:active { background: #e0f2fe; }
    .french { font-size: 21px; font-weight: bold; color: #1e3a8a; margin-bottom: 5px; }
    .english { font-size: 16px; color: #64748b; }
  </style>
</head>
<body>

  <h2 id="title">🇫🇷 French Phrases</h2>

  <div class="add-phrase-container">
    <input type="text" id="phraseInput" placeholder="Enter new phrase..." />
    <button id="addBtn" onclick="handleAddPhrase()">Translate & Add</button>
  </div>

  <div id="list">Loading...</div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyFm4CMsRhjso3PoojdVf1X3ucuBdiznvcfNrcbEmqrnaoRYkOcn5vWbPOGYjaT4BLy/exec';
    let frenchVoice = null;

    function loadVoices() {
      if ('speechSynthesis' in window) {
        let voices = window.speechSynthesis.getVoices();
        let frVoices = voices.filter(v => v.lang.startsWith('fr'));
        
        frenchVoice = frVoices.find(v => v.name.includes('Thomas')) || 
                      frVoices.find(v => v.name.includes('Nicolas')) || 
                      frVoices.find(v => v.lang === 'fr-FR') ||
                      frVoices[0];
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    async function loadData() {
      let container = document.getElementById('list');
      container.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">Loading phrases...</div>';

      try {
        // Fetch live data directly from Apps Script API (bypasses slow CSV CDN caching)
        const response = await fetch(SCRIPT_URL);
        const validCards = await response.json();

        container.innerHTML = '';

        if (!validCards || validCards.length === 0) {
          container.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">No phrases found. Add one above!</div>';
          return;
        }

        // Show newest phrases at the top
        validCards.reverse();

        validCards.forEach(item => {
          let card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = '<div class="french">' + escapeHtml(item.french) + '</div><div class="english">' + escapeHtml(item.english) + '</div>';
          card.onclick = function() { speakFrench(item.french); };
          container.appendChild(card);
        });

      } catch (err) {
        container.innerHTML = '<div style="text-align: center; color: #ef4444; padding: 20px;">Error loading phrases.</div>';
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    async function handleAddPhrase() {
      const input = document.getElementById('phraseInput');
      const phrase = input.value.trim();
      
      if (!phrase) return;

      const btn = document.getElementById('addBtn');
      btn.innerText = 'Translating...';
      btn.disabled = true;

      try {
        // 1. Send text to Google Apps Script and receive instant translation JSON
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ phrase: phrase })
        });

        const result = await response.json();

        if (result.status === 'success') {
          // If this is the first phrase added to an empty sheet, clear placeholder text
          const container = document.getElementById('list');
          if (container.innerText.includes('No phrases found') || container.innerText.includes('Loading')) {
            container.innerHTML = '';
          }

          // 2. Insert translated phrase card directly onto screen
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = '<div class="french">' + escapeHtml(result.french) + '</div><div class="english">' + escapeHtml(result.english) + '</div>';
          card.onclick = function() { speakFrench(result.french); };
          
          container.insertBefore(card, container.firstChild);
        } else {
          alert('Translation error: ' + (result.message || 'Unknown error'));
        }

      } catch (error) {
        alert('Failed to connect to translation server.');
      } finally {
        input.value = '';
        btn.innerText = 'Translate & Add';
        btn.disabled = false;
      }
    }

    function speakFrench(text) {
      if (!text) return;

      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.nativeSpeak) {
        window.webkit.messageHandlers.nativeSpeak.postMessage(text);
        return;
      }

      if (!('speechSynthesis' in window)) return;
      if (!frenchVoice) loadVoices();

      window.speechSynthesis.cancel();
      let utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'fr-FR';
      utterance.rate = 0.88;
      utterance.pitch = 0.95;

      if (frenchVoice) {
        utterance.voice = frenchVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    loadData();
  </script>
</body>
</html>
