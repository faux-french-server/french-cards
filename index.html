<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>French Phrases</title>

  <style>
    body { font-family: -apple-system, sans-serif; padding: 15px; background: #f4f4f9; margin: 0; }
    
    h2 { 
      text-align: center; 
      color: #333; 
      font-size: 26px; 
      margin-top: 10px; 
      margin-bottom: 20px;
      user-select: none;
    }

    .add-phrase-container {
      display: flex;
      gap: 8px;
      justify-content: center;
      max-width: 400px;
      margin: 0 auto 20px auto;
    }

    .add-phrase-container input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    .add-phrase-container button {
      padding: 10px 16px;
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .add-phrase-container button:active {
      opacity: 0.8;
    }    

    .card { background: white; padding: 18px; margin-bottom: 12px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); cursor: pointer; }
    .card:active { background: #e0f2fe; }
    .french { font-size: 21px; font-weight: bold; color: #1e3a8a; margin-bottom: 5px; }
    .english { font-size: 16px; color: #64748b; }
  </style>
</head>
<body>

  <h2 id="title">🇫🇷 French Phrases</h2>

  <div class="add-phrase-container">
    <input type="text" id="phraseInput" placeholder="Enter new phrase..." />
    <button id="addBtn" onclick="handleAddPhrase()">Translate & Add</button>
  </div>

  <div id="list"></div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyFm4CMsRhjso3PoojdVf1X3ucuBdiznvcfNrcbEmqrnaoRYkOcn5vWbPOGYjaT4BLy/exec';
    let frenchVoice = null;
    let localPhrases = [];

    function loadVoices() {
      if ('speechSynthesis' in window) {
        let voices = window.speechSynthesis.getVoices();
        let frVoices = voices.filter(v => v.lang.startsWith('fr'));
        
        frenchVoice = frVoices.find(v => v.name.includes('Thomas')) || 
                      frVoices.find(v => v.name.includes('Nicolas')) || 
                      frVoices.find(v => v.lang === 'fr-FR') ||
                      frVoices[0];
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    // Render cards array to DOM
    function renderCards(phrases) {
      const container = document.getElementById('list');
      container.innerHTML = '';

      if (!phrases || phrases.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">No phrases saved. Add one above!</div>';
        return;
      }

      phrases.forEach(item => {
        let card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = '<div class="french">' + escapeHtml(item.french) + '</div><div class="english">' + escapeHtml(item.english) + '</div>';
        card.onclick = function() { speakFrench(item.french); };
        container.appendChild(card);
      });
    }

    // Save phrase array to device storage
    function saveToLocalStorage(phrases) {
      try {
        localStorage.setItem('saved_french_phrases', JSON.stringify(phrases));
      } catch (e) {
        console.error('Could not save to localStorage', e);
      }
    }

    // Main initialization: load local storage immediately, sync remote in background if empty
    async function initData() {
      const stored = localStorage.getItem('saved_french_phrases');
      
      if (stored) {
        try {
          localPhrases = JSON.parse(stored);
          renderCards(localPhrases);
          return; // Loaded locally instantly! No fetch needed.
        } catch (e) {
          console.error('Error parsing local storage');
        }
      }

      // Fallback: If device memory is empty, fetch initial data from Google once
      fetchRemoteData();
    }

    async function fetchRemoteData() {
      const container = document.getElementById('list');
      container.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">Loading initial phrases...</div>';

      try {
        const response = await fetch(SCRIPT_URL, { method: 'GET', redirect: 'follow' });
        const remoteData = await response.json();

        if (Array.isArray(remoteData)) {
          localPhrases = remoteData.reverse(); // Newest first
          saveToLocalStorage(localPhrases);
          renderCards(localPhrases);
        }
      } catch (err) {
        container.innerHTML = '<div style="text-align: center; color: #ef4444; padding: 20px;">Error loading phrases. Add a phrase above to get started.</div>';
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    async function handleAddPhrase() {
      const input = document.getElementById('phraseInput');
      const phrase = input.value.trim();
      
      if (!phrase) return;

      const btn = document.getElementById('addBtn');
      btn.innerText = 'Translating...';
      btn.disabled = true;

      try {
        // 1. Send phrase to Apps Script for translation & Google Sheet backup
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ phrase: phrase })
        });

        const result = await response.json();

        if (result.status === 'success') {
          const newCard = { english: result.english, french: result.french };

          // 2. Add to top of local array
          localPhrases.unshift(newCard);

          // 3. Save to device memory
          saveToLocalStorage(localPhrases);

          // 4. Update screen instantly
          renderCards(localPhrases);

          input.value = '';
        } else {
          alert('Translation error: ' + (result.message || 'Unknown error'));
        }

      } catch (error) {
        alert('Failed to connect to translation server.');
      } finally {
        btn.innerText = 'Translate & Add';
        btn.disabled = false;
      }
    }

    function speakFrench(text) {
      if (!text) return;

      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.nativeSpeak) {
        window.webkit.messageHandlers.nativeSpeak.postMessage(text);
        return;
      }

      if (!('speechSynthesis' in window)) return;
      if (!frenchVoice) loadVoices();

      window.speechSynthesis.cancel();
      let utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'fr-FR';
      utterance.rate = 0.88;
      utterance.pitch = 0.95;

      if (frenchVoice) {
        utterance.voice = frenchVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    initData();
  </script>
</body>
</html>
