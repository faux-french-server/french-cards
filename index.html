<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>French Phrases</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 15px; background: #f4f4f9; margin: 0; }
    
    h2 { 
      text-align: center; 
      color: #333; 
      font-size: 26px; 
      margin-top: 10px; 
      margin-bottom: 20px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s ease;
    }
    h2:active { opacity: 0.5; }

    .card { background: white; padding: 18px; margin-bottom: 12px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); cursor: pointer; }
    .card:active { background: #e0f2fe; }
    .french { font-size: 21px; font-weight: bold; color: #1e3a8a; margin-bottom: 5px; }
    .english { font-size: 16px; color: #64748b; }
  </style>
</head>
<body>

  <h2 id="title" onclick="loadData()">🇫🇷 French Phrases</h2>

  <div id="list">Loading...</div>

  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQMjMGbQWhZN8bcQe_omRzqloetJEdMGLDylpPu-qVEL1kO0b-V3D44D7UYRBur_5qKivpko3ynpkkg/pub?gid=0&single=true&output=csv';

    // Store selected voice globally so it never shifts
    let selectedVoice = null;

    function initVoices() {
      if (!('speechSynthesis' in window)) return;
      let voices = window.speechSynthesis.getVoices();
      if (!voices.length) return;

      // Try to find a male French voice first (e.g. Thomas), or fall back to any French voice
      selectedVoice = voices.find(v => v.lang && v.lang.startsWith('fr') && v.name.toLowerCase().includes('thomas')) ||
                      voices.find(v => v.lang && v.lang.startsWith('fr') && (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('man'))) ||
                      voices.find(v => v.lang && v.lang.startsWith('fr'));
    }

    // Force Safari to load voices immediately
    if (typeof speechSynthesis !== 'undefined') {
      speechSynthesis.onvoiceschanged = initVoices;
      initVoices();
    }

    function parseCSVLine(line) {
      let values = [];
      let currentValue = '';
      let insideQuotes = false;

      for (let i = 0; i < line.length; i++) {
        let char = line[i];

        if (char === '"') {
          if (insideQuotes && line[i + 1] === '"') {
            currentValue += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) {
          values.push(currentValue.trim());
          currentValue = '';
        } else {
          currentValue += char;
        }
      }
      values.push(currentValue.trim());
      return values;
    }

    async function loadData() {
      let titleElem = document.getElementById('title');
      let container = document.getElementById('list');

      titleElem.innerHTML = '🔄 Updating...';

      try {
        const freshUrl = SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
        const response = await fetch(freshUrl);
        if (!response.ok) throw new Error('Network response failed');
        
        const text = await response.text();
        const lines = text.split(/\r?\n/);
        
        container.innerHTML = '';

        for (let i = 1; i < lines.length; i++) {
          let line = lines[i].trim();
          if (!line) continue;
          
          let cols = parseCSVLine(line);
          let english = cols[1] ? cols[1].replace(/^"|"$/g, '').trim() : '';
          let french = cols[2] ? cols[2].replace(/^"|"$/g, '').trim() : '';

          if (french || english) {
            let card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = '<div class="french">' + escapeHtml(french) + '</div><div class="english">' + escapeHtml(english) + '</div>';
            card.onclick = function() { speak(french); };
            container.appendChild(card);
          }
        }
      } catch (err) {
        container.innerHTML = '<div style="text-align: center; color: #ef4444; padding: 20px;">Error loading phrases. Tap title to try again.</div>';
      } finally {
        titleElem.innerHTML = '🇫🇷 French Phrases';
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function speak(text) {
      if (!text || !('speechSynthesis' in window)) return;
      
      window.speechSynthesis.cancel();
      let utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'fr-FR';
      utterance.rate = 0.85;

      // Re-check voices if not loaded yet
      if (!selectedVoice) {
        initVoices();
      }

      if (selectedVoice) {
        utterance.voice = selectedVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    loadData();
  </script>
</body>
</html>
