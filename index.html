<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>French Phrases</title>

  <style>
    body { font-family: -apple-system, sans-serif; padding: 0 15px 15px 15px; background: #f4f4f9; margin: 0; color: #333; }
    
    /* Fixed Top Header Container */
    .sticky-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background-color: #f4f4f9;
      padding-top: calc(env(safe-area-inset-top, 20px) + 10px);
      padding-bottom: 12px;
      padding-left: 15px;
      padding-right: 15px;
      z-index: 1000;
      border-bottom: 1px solid #cbd5e1;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    /* Top Row: Title + Sync */
    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    h2 { 
      color: #333; 
      font-size: 24px; 
      margin: 0;
      user-select: none;
      white-space: nowrap;
    }

    /* Sub Row: Filter + Study Mode */
    .header-sub-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .category-filter-select {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 18px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      text-transform: capitalize;
    }

    .sync-btn {
      background: #e2e8f0;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, background-color 0.2s ease;
      color: #475569;
      padding: 0;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .sync-btn:active {
      transform: scale(0.9);
      background: #cbd5e1;
    }

    .sync-btn svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    /* Study Mode Toggle Button */
    .study-btn {
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
      border-radius: 18px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .study-btn.active {
      background: #007aff;
      color: white;
      border-color: #007aff;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .spinning {
      animation: spin 0.8s linear infinite;
    }

    .add-phrase-container {
      display: flex;
      gap: 8px;
      justify-content: center;
      max-width: 500px;
      margin: 0 auto;
    }

    .add-phrase-container input, .modal-input {
      flex: 1;
      min-width: 0;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      background: #ffffff;
      color: #1e293b;
      box-sizing: border-box;
    }

    .modal-input {
      width: 100%;
      margin-bottom: 15px;
    }

    .add-phrase-container button {
      padding: 10px 16px;
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .add-phrase-container button:active {
      opacity: 0.8;
    }    

    #list {
      overflow: hidden;
      padding-top: calc(env(safe-area-inset-top, 20px) + 155px);
    }

    .card { 
      position: relative;
      background: white; 
      padding: 18px;
      padding-bottom: 20px;
      margin-bottom: 12px; 
      border-radius: 12px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.08); 
      touch-action: pan-y;
      will-change: transform;
      z-index: 1;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    /* Interactive Category Pill Badge */
    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: 12px;
      margin-bottom: 8px;
      background: #e2e8f0;
      color: #475569;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0.05);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .category-badge::after {
      content: '▾';
      font-size: 10px;
      margin-left: 2px;
    }

    .category-badge:active {
      transform: scale(0.95);
      opacity: 0.8;
    }

    .category-badge.morning {
      background: #fef3c7;
      color: #92400e;
    }

    .category-badge.evening {
      background: #e0e7ff;
      color: #3730a3;
    }

    .category-badge.other {
      background: #f1f5f9;
      color: #475569;
    }

    /* Revealed state styling in Study Mode */
    .card.study-revealed {
      cursor: pointer;
      border: 1px dashed #007aff;
    }

    /* Study Mode Card Styling (Hidden State) */
    .card.study-card {
      border: 2px dashed #cbd5e1;
      background: #f8fafc;
      text-align: center;
      padding: 24px 18px;
    }

    .card.study-card .english-prompt {
      font-size: 18px;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
      display: inline-block;
      padding: 6px 12px;
      border-radius: 8px;
      -webkit-tap-highlight-color: rgba(0, 122, 255, 0.1);
      transition: background-color 0.15s ease;
    }

    .card.study-card .english-prompt:active {
      background-color: #e2e8f0;
    }

    .card.study-card .tap-hint {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
      pointer-events: none;
    }

    .card.animating {
      transition: transform 0.25s ease-out, opacity 0.25s ease-out;
    }

    .translation-row {
      margin-bottom: 10px;
    }

    .translation-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 2px;
    }

    .french { 
      font-size: 19px; 
      font-weight: bold; 
      color: #1e3a8a; 
      cursor: pointer;
      display: inline-block;
      -webkit-tap-highlight-color: rgba(30, 58, 138, 0.1);
    }

    .french.slang-text {
      color: #0284c7;
    }

    .french:active {
      opacity: 0.7;
    }

    .english { font-size: 15px; color: #64748b; margin-top: 4px; user-select: none; }

    .delete-btn {
      display: block;
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      font-size: 22px;
      color: #94a3b8;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
      border-radius: 50%;
      transition: color 0.2s ease, background-color 0.2s ease;
      z-index: 10;
    }

    .delete-btn:hover {
      color: #ef4444;
      background-color: #fee2e2;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      font-size: 13px;
      cursor: pointer;
      padding: 4px 8px;
      margin-left: 4px;
      line-height: 1;
      vertical-align: middle;
      transition: transform 0.15s ease, background-color 0.2s ease, color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      color: #334155;
    }

    .action-btn svg {
      width: 15px;
      height: 15px;
      display: block;
    }

    .action-btn:hover {
      background-color: #e2e8f0;
    }

    .action-btn:active {
      transform: scale(0.9);
      background-color: #cbd5e1;
    }

    .action-btn.copied {
      background-color: #dcfce7;
      border-color: #86efac;
      color: #166534;
      font-weight: bold;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: white;
      border-radius: 14px;
      padding: 20px;
      width: 80%;
      max-width: 300px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      transform: scale(0.9);
      transition: transform 0.2s ease;
    }

    .modal-overlay.active .modal-box {
      transform: scale(1);
    }

    .modal-title {
      font-size: 17px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .modal-message {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 15px;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
    }

    .modal-btn {
      flex: 1;
      padding: 10px 0;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .modal-btn-cancel {
      background: #f1f5f9;
      color: #475569;
    }

    .modal-btn-confirm {
      background: #007aff;
      color: white;
    }

    .modal-btn-delete {
      background: #ef4444;
      color: white;
    }

    /* Category Picker Modal Options */
    .category-picker-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 15px;
      max-height: 250px;
      overflow-y: auto;
    }

    .category-option-btn {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      font-size: 15px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      text-transform: capitalize;
      transition: background-color 0.15s ease;
    }

    .category-option-btn.add-new-btn {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #1d4ed8;
    }

    .category-option-btn:active {
      background: #e2e8f0;
    }

    body.is-native-app .delete-btn {
      display: none !important;
    }

    /* Automatic Dark Mode Styles */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0f172a;
        color: #f8fafc;
      }

      .sticky-header {
        background-color: #0f172a;
        border-bottom-color: #334155;
      }

      h2 {
        color: #f8fafc;
      }

      .category-filter-select {
        background: #1e293b;
        border-color: #334155;
        color: #cbd5e1;
      }

      .sync-btn {
        background: #1e293b;
        color: #94a3b8;
      }

      .sync-btn:active {
        background: #334155;
      }

      .study-btn {
        background: #1e293b;
        border-color: #334155;
        color: #cbd5e1;
      }

      .study-btn.active {
        background: #007aff;
        color: white;
        border-color: #007aff;
      }

      .add-phrase-container input, .modal-input {
        background: #1e293b;
        border-color: #334155;
        color: #f8fafc;
      }

      .add-phrase-container input::placeholder, .modal-input::placeholder {
        color: #64748b;
      }

      .card {
        background: #1e293b;
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      }

      .category-badge.morning {
        background: #78350f;
        color: #fef3c7;
      }

      .category-badge.evening {
        background: #312e81;
        color: #e0e7ff;
      }

      .category-badge.other {
        background: #334155;
        color: #cbd5e1;
      }

      .card.study-card {
        background: #1e293b;
        border-color: #334155;
      }

      .card.study-revealed {
        border-color: #38bdf8;
      }

      .card.study-card .english-prompt {
        color: #f8fafc;
      }

      .card.study-card .english-prompt:active {
        background-color: #334155;
      }

      .card.study-card .tap-hint {
        color: #64748b;
      }

      .translation-label {
        color: #64748b;
      }

      .french {
        color: #60a5fa;
      }

      .french.slang-text {
        color: #38bdf8;
      }

      .english {
        color: #94a3b8;
      }

      .action-btn {
        background: #334155;
        border-color: #475569;
        color: #cbd5e1;
      }

      .action-btn:hover {
        background-color: #475569;
      }

      .action-btn:active {
        background-color: #64748b;
      }

      .action-btn.copied {
        background-color: #064e3b;
        border-color: #059669;
        color: #a7f3d0;
      }

      .delete-btn {
        color: #64748b;
      }

      .delete-btn:hover {
        color: #f87171;
        background-color: #450a0a;
      }

      .modal-box {
        background: #1e293b;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      }

      .modal-title {
        color: #f8fafc;
      }

      .modal-message {
        color: #94a3b8;
      }

      .modal-btn-cancel {
        background: #334155;
        color: #cbd5e1;
      }

      .category-option-btn {
        background: #334155;
        border-color: #475569;
        color: #f8fafc;
      }

      .category-option-btn.add-new-btn {
        background: #1e3a8a;
        border-color: #3b82f6;
        color: #bfdbfe;
      }

      .category-option-btn:active {
        background: #475569;
      }
    }
  </style>
</head>
<body>

  <!-- Fixed Top Header Container -->
  <div class="sticky-header">
    <!-- Top Row: Title + Sync Button -->
    <div class="header-top-row">
      <h2>🇫🇷 French Phrases</h2>
      <button class="sync-btn" id="syncBtn" onclick="syncWithCloud()" title="Sync from Google Sheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6"></path>
          <path d="M2.5 22v-6h6"></path>
          <path d="M2 11.5a10 10 0 0 1 18.8-4.3L21.5 8"></path>
          <path d="M22 12.5a10 10 0 0 1-18.8 4.2L2.5 16"></path>
        </svg>
      </button>
    </div>

    <!-- Sub Row: Category Filter + Study Mode Toggle -->
    <div class="header-sub-row">
      <select class="category-filter-select" id="categoryFilter" onchange="filterByCategory()">
        <option value="all">📁 All Categories</option>
      </select>

      <button class="study-btn" id="studyBtn" onclick="toggleStudyMode()">
        <span>🎴</span> Study Mode
      </button>
    </div>

    <!-- Input Form -->
    <form class="add-phrase-container" onsubmit="event.preventDefault(); handleAddPhrase();">
      <input type="text" id="phraseInput" placeholder="Enter new phrase..." onkeydown="handleKeyPress(event)" />
      <button type="submit" id="addBtn">Translate</button>
    </form>
  </div>

  <div id="list"></div>

  <!-- Delete Confirm Modal -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-box">
      <div class="modal-title">Delete Phrase</div>
      <div class="modal-message">Are you sure you want to delete this phrase?</div>
      <div class="modal-buttons">
        <button class="modal-btn modal-btn-cancel" onclick="closeConfirmModal(false)">Cancel</button>
        <button class="modal-btn modal-btn-delete" onclick="closeConfirmModal(true)">Delete</button>
      </div>
    </div>
  </div>

  <!-- Category Quick-Picker Modal -->
  <div class="modal-overlay" id="categoryPickerModal">
    <div class="modal-box">
      <div class="modal-title">Change Category</div>
      <div class="modal-message">Select a category for this phrase:</div>
      <div class="category-picker-options" id="categoryPickerOptions">
        <!-- Options injected dynamically -->
      </div>
      <div style="margin-top: 15px;">
        <button class="modal-btn modal-btn-cancel" style="width: 100%;" onclick="closeCategoryPickerModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- New Category Input Modal -->
  <div class="modal-overlay" id="newCategoryModal">
    <div class="modal-box">
      <div class="modal-title">New Category</div>
      <div class="modal-message">Type a name for the new category:</div>
      <input type="text" class="modal-input" id="newCategoryInput" placeholder="Category name..." />
      <div class="modal-buttons">
        <button class="modal-btn modal-btn-cancel" onclick="closeNewCategoryModal(false)">Cancel</button>
        <button class="modal-btn modal-btn-confirm" onclick="closeNewCategoryModal(true)">Create</button>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyFm4CMsRhjso3PoojdVf1X3ucuBdiznvcfNrcbEmqrnaoRYkOcn5vWbPOGYjaT4BLy/exec';
    let frenchVoice = null;
    let localPhrases = [];
    let categoriesList = ["morning", "evening", "other"];
    let pendingDeleteIndex = null;
    let pendingDeleteCard = null;
    let activeCategoryChangeIndex = null;

    let isStudyMode = false;
    let revealedCardIndices = new Set();
    let currentCategoryFilter = 'all';

    const copyIconSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"></path><rect x="9" y="9" width="12" height="12" rx="2" ry="2"></rect></svg>`;

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    function checkEnvironment() {
      const isNativeApp = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.nativeSpeak);
      if (isNativeApp) {
        document.body.classList.add('is-native-app');
      }
    }
    checkEnvironment();

    function getCategoryEmoji(cat) {
      switch (cat.toLowerCase()) {
        case 'morning': return '🌅';
        case 'evening': return '🌙';
        case 'other': return '💬';
        default: return '🏷️';
      }
    }

    function updateCategoryDropdowns() {
      // 1. Update Header Filter Dropdown
      const select = document.getElementById('categoryFilter');
      const selectedVal = currentCategoryFilter;
      select.innerHTML = '<option value="all">📁 All Categories</option>';
      
      categoriesList.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = `${getCategoryEmoji(cat)} ${cat.charAt(0).toUpperCase() + cat.slice(1)}`;
        select.appendChild(option);
      });
      select.value = selectedVal;

      // 2. Update Modal Quick-Picker Options
      const optionsContainer = document.getElementById('categoryPickerOptions');
      optionsContainer.innerHTML = '';

      categoriesList.forEach(cat => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'category-option-btn';
        btn.innerHTML = `${getCategoryEmoji(cat)} ${escapeHtml(cat)}`;
        btn.onclick = () => updateCardCategory(cat);
        optionsContainer.appendChild(btn);
      });

      // Add "➕ Add New Category" Option
      const addNewBtn = document.createElement('button');
      addNewBtn.type = 'button';
      addNewBtn.className = 'category-option-btn add-new-btn';
      addNewBtn.innerHTML = '➕ Add New Category...';
      addNewBtn.onclick = openNewCategoryModal;
      optionsContainer.appendChild(addNewBtn);
    }

    function registerCategory(newCat) {
      const cleanCat = newCat.trim().toLowerCase();
      if (cleanCat && !categoriesList.includes(cleanCat)) {
        categoriesList.push(cleanCat);
        saveCategoriesToLocalStorage(categoriesList);
        updateCategoryDropdowns();
      }
      return cleanCat;
    }

    function openNewCategoryModal() {
      document.getElementById('newCategoryInput').value = '';
      document.getElementById('newCategoryModal').classList.add('active');
      setTimeout(() => document.getElementById('newCategoryInput').focus(), 100);
    }

    function closeNewCategoryModal(confirmed) {
      const input = document.getElementById('newCategoryInput');
      const val = input.value.trim();
      document.getElementById('newCategoryModal').classList.remove('active');

      if (confirmed && val) {
        const cleanCat = registerCategory(val);
        if (cleanCat) {
          updateCardCategory(cleanCat);
        }
      }
    }

    function openCategoryPickerModal(e, index) {
      e.stopPropagation();
      activeCategoryChangeIndex = index;
      document.getElementById('categoryPickerModal').classList.add('active');
    }

    function closeCategoryPickerModal() {
      activeCategoryChangeIndex = null;
      document.getElementById('categoryPickerModal').classList.remove('active');
    }

    async function updateCardCategory(newCat) {
      if (activeCategoryChangeIndex !== null && localPhrases[activeCategoryChangeIndex]) {
        const item = localPhrases[activeCategoryChangeIndex];
        const cleanCat = registerCategory(newCat);
        item.category = cleanCat;
        saveToLocalStorage(localPhrases);
        renderCards(localPhrases);

        // Sync category update to Google Sheet
        try {
          await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
              action: 'updateCategory',
              english: item.english,
              category: cleanCat
            })
          });
        } catch (e) {
          console.error('Failed to sync updated category to Google Sheet', e);
        }
      }
      closeCategoryPickerModal();
    }

    function filterByCategory() {
      currentCategoryFilter = document.getElementById('categoryFilter').value;
      revealedCardIndices.clear();
      renderCards(localPhrases);
    }

    function toggleStudyMode() {
      isStudyMode = !isStudyMode;
      revealedCardIndices.clear();

      const studyBtn = document.getElementById('studyBtn');
      if (isStudyMode) {
        studyBtn.classList.add('active');
      } else {
        studyBtn.classList.remove('active');
      }

      renderCards(localPhrases);
    }

    function revealStudyCard(index, item) {
      revealedCardIndices.add(index);
      renderCards(localPhrases);

      unlockAudioOnIOS();

      if (item.french && item.slang) {
        speakFrenchSequence(item.french, item.slang);
      } else if (item.french) {
        speakFrench(item.french, false);
      } else if (item.slang) {
        speakFrench(item.slang, false);
      }
    }

    function hideStudyCard(index) {
      revealedCardIndices.delete(index);
      renderCards(localPhrases);
    }

    function loadVoices() {
      if ('speechSynthesis' in window) {
        let voices = window.speechSynthesis.getVoices();
        let frVoices = voices.filter(v => v.lang.startsWith('fr'));
        
        frenchVoice = frVoices.find(v => v.name.includes('Thomas')) || 
                      frVoices.find(v => v.name.includes('Nicolas')) || 
                      frVoices.find(v => v.lang === 'fr-FR') ||
                      frVoices[0];
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    function renderCards(phrases) {
      const container = document.getElementById('list');
      container.innerHTML = '';

      if (!phrases || phrases.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">No phrases saved. Add one above!</div>';
        return;
      }

      const filteredPhrases = phrases.map((item, originalIndex) => ({ ...item, originalIndex }))
        .filter(item => {
          if (currentCategoryFilter === 'all') return true;
          const cat = (item.category || 'other').toLowerCase();
          return cat === currentCategoryFilter;
        });

      if (filteredPhrases.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">No phrases found in this category.</div>';
        return;
      }

      filteredPhrases.forEach((item) => {
        const index = item.originalIndex;
        let card = document.createElement('div');
        const cat = (item.category || 'other').toLowerCase();

        // Study Mode: Hidden state
        if (isStudyMode && !revealedCardIndices.has(index)) {
          card.className = 'card study-card';
          
          let contentHtml = `<button class="delete-btn" onclick="handleWebDelete(event, ${index}, this.parentElement)" title="Delete Phrase">&times;</button>`;
          contentHtml += `
            <div>
              <span class="category-badge ${cat}" onclick="openCategoryPickerModal(event, ${index})">${cat}</span>
            </div>
            <div class="english-prompt" onclick="revealStudyCard(${index}, localPhrases[${index}])">
              ${escapeHtml(item.english)}
            </div>
            <div class="tap-hint">Tap text to reveal & listen 👆</div>
          `;
          
          card.innerHTML = contentHtml;
          attachSwipeHandler(card, index);
          container.appendChild(card);
          return;
        }

        // Standard Card view or Revealed Study Card
        card.className = 'card' + (isStudyMode ? ' study-revealed' : '');

        if (isStudyMode) {
          card.onclick = (e) => {
            if (!e.target.closest('.delete-btn') && 
                !e.target.closest('.action-btn') && 
                !e.target.closest('.french') &&
                !e.target.closest('.category-badge')) {
              hideStudyCard(index);
            }
          };
        }

        let contentHtml = `<button class="delete-btn" onclick="handleWebDelete(event, ${index}, this.parentElement)" title="Delete Phrase">&times;</button>`;
        contentHtml += `<div><span class="category-badge ${cat}" onclick="openCategoryPickerModal(event, ${index})">${cat}</span></div>`;

        if (item.french) {
          contentHtml += `
            <div class="translation-row">
              <div class="translation-label">Standard</div>
              <div class="french" onclick="handleSpeechClick(event, '${escapeJsQuote(item.french)}', false)">
                ${escapeHtml(item.french)}
              </div>
              <button class="action-btn" onclick="handleSpeechClick(event, '${escapeJsQuote(item.french)}', true)" title="Play slowly">🐢</button>
              <button class="action-btn" onclick="copyToClipboard(event, '${escapeJsQuote(item.french)}', this)" title="Copy to clipboard">${copyIconSvg}</button>
            </div>
          `;
        }

        if (item.slang) {
          contentHtml += `
            <div class="translation-row">
              <div class="translation-label">Slang / Modern</div>
              <div class="french slang-text" onclick="handleSpeechClick(event, '${escapeJsQuote(item.slang)}', false)">
                ${escapeHtml(item.slang)}
              </div>
              <button class="action-btn" onclick="handleSpeechClick(event, '${escapeJsQuote(item.slang)}', true)" title="Play slowly">🐢</button>
              <button class="action-btn" onclick="copyToClipboard(event, '${escapeJsQuote(item.slang)}', this)" title="Copy to clipboard">${copyIconSvg}</button>
            </div>
          `;
        }

        contentHtml += `<div class="english">${escapeHtml(item.english)}</div>`;

        card.innerHTML = contentHtml;

        attachSwipeHandler(card, index);

        container.appendChild(card);
      });
    }

    function handleSpeechClick(e, text, isSlow) {
      e.stopPropagation();
      unlockAudioOnIOS();
      speakFrench(text, isSlow);
    }

    function copyToClipboard(e, text, btnElement) {
      e.stopPropagation();
      
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text);
      } else {
        let textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-999999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand('copy');
        } catch (err) {
          console.error('Fallback copy failed', err);
        }
        document.body.removeChild(textArea);
      }

      btnElement.innerHTML = "✓";
      btnElement.classList.add("copied");

      setTimeout(() => {
        btnElement.innerHTML = copyIconSvg;
        btnElement.classList.remove("copied");
      }, 1500);
    }

    function handleWebDelete(e, index, cardElement) {
      e.stopPropagation();
      openConfirmModal(index, cardElement);
    }

    function openConfirmModal(index, cardElement) {
      pendingDeleteIndex = index;
      pendingDeleteCard = cardElement;
      document.getElementById('confirmModal').classList.add('active');
    }

    function closeConfirmModal(confirmed) {
      document.getElementById('confirmModal').classList.remove('active');

      if (confirmed && pendingDeleteIndex !== null) {
        if (pendingDeleteCard) {
          pendingDeleteCard.style.transform = 'translateX(100vw)';
          pendingDeleteCard.style.opacity = '0';
          setTimeout(() => {
            deletePhrase(pendingDeleteIndex);
            resetModalState();
          }, 200);
        } else {
          deletePhrase(pendingDeleteIndex);
          resetModalState();
        }
      } else {
        if (pendingDeleteCard) {
          pendingDeleteCard.classList.add('animating');
          pendingDeleteCard.style.transform = 'translateX(0px)';
          pendingDeleteCard.style.opacity = '1';
        }
        resetModalState();
      }
    }

    function resetModalState() {
      pendingDeleteIndex = null;
      pendingDeleteCard = null;
    }

    function attachSwipeHandler(card, index) {
      let startX = 0;
      let startY = 0;
      let currentX = 0;
      let isSwiping = false;

      card.addEventListener('touchstart', (e) => {
        if (e.target.closest('.delete-btn') || e.target.closest('.action-btn') || e.target.closest('.category-badge')) return;

        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        isSwiping = false;
        card.classList.remove('animating');
      }, { passive: true });

      card.addEventListener('touchmove', (e) => {
        let touchX = e.touches[0].clientX;
        let touchY = e.touches[0].clientY;
        
        let deltaX = touchX - startX;
        let deltaY = touchY - startY;

        if (!isSwiping && Math.abs(deltaY) > Math.abs(deltaX)) {
          return;
        }

        if (deltaX > 0) {
          isSwiping = true;
          currentX = deltaX;
          card.style.transform = `translateX(${deltaX}px)`;
          card.style.opacity = Math.max(0.2, 1 - (deltaX / 300));
        }
      }, { passive: true });

      card.addEventListener('touchend', (e) => {
        if (e.target.closest('.delete-btn') || e.target.closest('.action-btn') || e.target.closest('.category-badge')) return;

        card.classList.add('animating');

        if (isSwiping && currentX > 110) {
          openConfirmModal(index, card);
        } else {
          card.style.transform = 'translateX(0px)';
          card.style.opacity = '1';
        }

        currentX = 0;
        isSwiping = false;
      });
    }

    async function deletePhrase(index) {
      const itemToDelete = localPhrases[index];

      localPhrases.splice(index, 1);
      revealedCardIndices.delete(index);
      saveToLocalStorage(localPhrases);
      renderCards(localPhrases);

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'delete',
            english: itemToDelete.english
          })
        });
      } catch (e) {
        console.error('Failed to sync deletion with Google Sheet', e);
      }
    }

    function saveToLocalStorage(phrases) {
      try {
        localStorage.setItem('saved_french_phrases', JSON.stringify(phrases));
      } catch (e) {
        console.error('Could not save to localStorage', e);
      }
    }

    function saveCategoriesToLocalStorage(cats) {
      try {
        localStorage.setItem('saved_french_categories', JSON.stringify(cats));
      } catch (e) {
        console.error('Could not save categories to localStorage', e);
      }
    }

    async function initData() {
      checkEnvironment();

      const storedCats = localStorage.getItem('saved_french_categories');
      if (storedCats) {
        try {
          categoriesList = JSON.parse(storedCats);
        } catch (e) {}
      }
      updateCategoryDropdowns();

      const stored = localStorage.getItem('saved_french_phrases');
      if (stored) {
        try {
          localPhrases = JSON.parse(stored);
          localPhrases.forEach(p => {
            if (p.category) registerCategory(p.category);
          });
          renderCards(localPhrases);
          return;
        } catch (e) {
          console.error('Error parsing local storage');
        }
      }

      syncWithCloud();
    }

    async function syncWithCloud() {
      const syncBtn = document.getElementById('syncBtn');
      syncBtn.classList.add('spinning');

      try {
        const freshUrl = SCRIPT_URL + (SCRIPT_URL.includes('?') ? '&' : '?') + 'cacheBust=' + Date.now();
        const response = await fetch(freshUrl, { method: 'GET', redirect: 'follow' });
        const remoteData = await response.json();

        let phrasesData = [];
        if (Array.isArray(remoteData)) {
          phrasesData = remoteData;
        } else if (remoteData && remoteData.phrases) {
          phrasesData = remoteData.phrases;
          if (Array.isArray(remoteData.categories)) {
            remoteData.categories.forEach(c => registerCategory(c));
          }
        }

        localPhrases = phrasesData.reverse();
        localPhrases.forEach(p => {
          if (p.category) registerCategory(p.category);
        });

        saveToLocalStorage(localPhrases);
        renderCards(localPhrases);

      } catch (err) {
        alert('Could not sync with Google Sheets. Check connection.');
      } finally {
        syncBtn.classList.remove('spinning');
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function escapeJsQuote(str) {
      if (!str) return '';
      return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleAddPhrase();
      }
    }

    async function handleAddPhrase() {
      const input = document.getElementById('phraseInput');
      const phrase = input.value.trim();
      const category = 'other'; // Defaults to 'other' on creation
      
      if (!phrase) return;

      unlockAudioOnIOS();

      const btn = document.getElementById('addBtn');
      btn.innerText = 'Translating...';
      btn.disabled = true;

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ 
            phrase: phrase,
            category: category 
          })
        });

        const result = await response.json();

        if (result.status === 'success') {
          const newCard = { 
            english: result.english, 
            french: result.french,
            slang: result.slang,
            category: result.category || category
          };

          localPhrases.unshift(newCard);
          saveToLocalStorage(localPhrases);

          if (isStudyMode) {
            revealedCardIndices.add(0);
          }

          renderCards(localPhrases);

          input.value = '';

          if (result.french && result.slang) {
            speakFrenchSequence(result.french, result.slang);
          } else if (result.french) {
            speakFrench(result.french, false);
          } else if (result.slang) {
            speakFrench(result.slang, false);
          }

        } else {
          alert('Translation error: ' + (result.message || 'Unknown error'));
        }

      } catch (error) {
        alert('Failed to connect to translation server.');
      } finally {
        btn.innerText = 'Translate';
        btn.disabled = false;
      }
    }

    function speakFrenchSequence(firstText, secondText) {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.nativeSpeak) {
        window.webkit.messageHandlers.nativeSpeak.postMessage("NORMAL|" + firstText);
        
        const speechRateMultiplier = isIOS ? 60 : 50; 
        const estimatedDurationMs = (firstText.length * speechRateMultiplier) + 400;
        
        setTimeout(() => {
          window.webkit.messageHandlers.nativeSpeak.postMessage("NORMAL|" + secondText);
        }, estimatedDurationMs);
        return;
      }

      if (!('speechSynthesis' in window)) return;
      if (!frenchVoice) loadVoices();

      window.speechSynthesis.cancel();

      let utterance1 = new SpeechSynthesisUtterance(firstText);
      utterance1.lang = 'fr-FR';
      utterance1.rate = isIOS ? 0.52 : 0.88;
      if (frenchVoice) utterance1.voice = frenchVoice;

      utterance1.onend = function() {
        setTimeout(() => {
          let utterance2 = new SpeechSynthesisUtterance(secondText);
          utterance2.lang = 'fr-FR';
          utterance2.rate = isIOS ? 0.52 : 0.88;
          if (frenchVoice) utterance2.voice = frenchVoice;
          window.speechSynthesis.speak(utterance2);
        }, 500);
      };

      window.speechSynthesis.speak(utterance1);
    }

    function unlockAudioOnIOS() {
      if ('speechSynthesis' in window && !window.webkit?.messageHandlers?.nativeSpeak) {
        let silentUtterance = new SpeechSynthesisUtterance('');
        silentUtterance.volume = 0;
        window.speechSynthesis.speak(silentUtterance);
      }
    }

    function speakFrench(text, isSlow = false) {
      if (!text) return;

      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.nativeSpeak) {
        const payload = (isSlow ? "SLOW|" : "NORMAL|") + text;
        window.webkit.messageHandlers.nativeSpeak.postMessage(payload);
        return;
      }

      if (!('speechSynthesis' in window)) return;
      if (!frenchVoice) loadVoices();

      window.speechSynthesis.cancel();

      let utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'fr-FR';

      if (isIOS) {
        utterance.rate = isSlow ? 0.25 : 0.52;
      } else {
        utterance.rate = isSlow ? 0.5 : 0.88;
      }

      utterance.pitch = 0.95;

      if (frenchVoice) {
        utterance.voice = frenchVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    initData();
  </script>
