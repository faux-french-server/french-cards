<script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQMjMGbQWhZN8bcQe_omRzqloetJEdMGLDylpPu-qVEL1kO0b-V3D44D7UYRBur_5qKivpko3ynpkkg/pub?gid=0&single=true&output=csv';

    // Proper CSV parser that handles commas inside quotes
    function parseCSVLine(text) {
      let result = [];
      let cell = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        let c = text[i];
        if (c === '"') {
          inQuotes = !inQuotes;
        } else if (c === ',' && !inQuotes) {
          result.push(cell.trim());
          cell = '';
        } else {
          cell += c;
        }
      }
      result.push(cell.trim());
      return result;
    }

    async function loadData() {
      try {
        const response = await fetch(SHEET_CSV_URL);
        const text = await response.text();
        const lines = text.split(/\r?\n/);
        
        let container = document.getElementById('list');
        container.innerHTML = '';

        // Skip header row 1
        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          
          let cols = parseCSVLine(lines[i]);
          let english = cols[1] ? cols[1].replace(/^"|"$/g, '') : ''; // Col B
          let french = cols[2] ? cols[2].replace(/^"|"$/g, '') : '';  // Col C

          if (french || english) {
            let card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = '<div class="french">' + french + '</div><div class="english">' + english + '</div>';
            card.onclick = () => speak(french);
            container.appendChild(card);
          }
        }
      } catch (err) {
        document.getElementById('list').innerText = 'Error loading sheet data.';
      }
    }

    function speak(text) {
      if (!text) return;
      window.speechSynthesis.cancel();
      let utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'fr-FR';
      utterance.rate = 0.85;

      // Ensure iOS selects a French voice explicitly
      let voices = window.speechSynthesis.getVoices();
      let frenchVoice = voices.find(v => v.lang.startsWith('fr'));
      if (frenchVoice) {
        utterance.voice = frenchVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    // Pre-load voices for Safari/iOS
    if (typeof speechSynthesis !== 'undefined') {
      speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    }

    loadData();
  </script>
