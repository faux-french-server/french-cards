<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>French Phrases</title>
  
  <script src="config.js"></script>

  <style>
    body { font-family: -apple-system, sans-serif; padding: 15px; background: #f4f4f9; margin: 0; }
    
    h2 { 
      text-align: center; 
      color: #333; 
      font-size: 26px; 
      margin-top: 10px; 
      margin-bottom: 20px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s ease;
    }
    h2:active { opacity: 0.5; }

    .card { background: white; padding: 18px; margin-bottom: 12px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); cursor: pointer; }
    .card:active { background: #e0f2fe; }
    .french { font-size: 21px; font-weight: bold; color: #1e3a8a; margin-bottom: 5px; }
    .english { font-size: 16px; color: #64748b; }
  </style>
</head>
<body>

  <h2 id="title" onclick="loadData()">🇫🇷 French Phrases</h2>

  <div id="list">Loading...</div>

  <script>
    let frenchVoice = null;

    function loadVoices() {
      if ('speechSynthesis' in window) {
        let voices = window.speechSynthesis.getVoices();
        
        // Filter for French language voices
        let frVoices = voices.filter(v => v.lang.startsWith('fr'));
        
        // Target male French voices (Thomas first, then Nicolas)
        frenchVoice = frVoices.find(v => v.name.includes('Thomas')) || 
                      frVoices.find(v => v.name.includes('Nicolas')) || 
                      frVoices.find(v => v.lang === 'fr-FR') ||
                      frVoices[0];
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    function parseCSVLine(line) {
      let values = [];
      let currentValue = '';
      let insideQuotes = false;

      for (let i = 0; i < line.length; i++) {
        let char = line[i];

        if (char === '"') {
          if (insideQuotes && line[i + 1] === '"') {
            currentValue += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) {
          values.push(currentValue.trim());
          currentValue = '';
        } else {
          currentValue += char;
        }
      }
      values.push(currentValue.trim());
      return values;
    }

    async function loadData() {
      let titleElem = document.getElementById('title');
      let container = document.getElementById('list');

      titleElem.innerHTML = '🔄 Updating...';

      try {
        const freshUrl = SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
        const response = await fetch(freshUrl);
        if (!response.ok) throw new Error('Network response failed');
        
        const text = await response.text();
        const lines = text.split(/\r?\n/);
        
        let validCards = [];

        for (let i = 1; i < lines.length; i++) {
          let line = lines[i].trim();
          if (!line) continue;
          
          let cols = parseCSVLine(line);
          let english = cols[1] ? cols[1].replace(/^"|"$/g, '').trim() : '';
          let french = cols[2] ? cols[2].replace(/^"|"$/g, '').trim() : '';

          if (french || english) {
            validCards.push({ french, english });
          }
        }

        validCards.reverse();
        container.innerHTML = '';

        validCards.forEach(item => {
          let card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = '<div class="french">' + escapeHtml(item.french) + '</div><div class="english">' + escapeHtml(item.english) + '</div>';
          card.onclick = function() { speakFrench(item.french); };
          container.appendChild(card);
        });

      } catch (err) {
        container.innerHTML = '<div style="text-align: center; color: #ef4444; padding: 20px;">Error loading phrases. Tap title to try again.</div>';
      } finally {
        titleElem.innerHTML = '🇫🇷 French Phrases';
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

function speakFrench(text) {
  if (!text) return;

  // 1. If running inside native iOS app, send text to Swift AVSpeechSynthesizer
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.nativeSpeak) {
    window.webkit.messageHandlers.nativeSpeak.postMessage(text);
    return;
  }

  // 2. Fallback for regular web browsers
  if (!('speechSynthesis' in window)) return;
  if (!frenchVoice) loadVoices();

  window.speechSynthesis.cancel();
  let utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'fr-FR';
  utterance.rate = 0.88;
  utterance.pitch = 0.95;

  if (frenchVoice) {
    utterance.voice = frenchVoice;
  }

  window.speechSynthesis.speak(utterance);
}

    loadData();
  </script>
</body>
</html>
