<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>French Phrases</title>
  
  <script src="config.js"></script>

  <style>
    body { font-family: -apple-system, sans-serif; padding: 15px; background: #f4f4f9; margin: 0; }
    
    h2 { 
      text-align: center; 
      color: #333; 
      font-size: 26px; 
      margin-top: 10px; 
      margin-bottom: 20px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s ease;
    }
    h2:active { opacity: 0.5; }

    .add-phrase-container {
      display: flex;
      gap: 8px;
      justify-content: center;
      max-width: 400px;
      margin: 0 auto 20px auto;
    }

    .add-phrase-container input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    .add-phrase-container button {
      padding: 10px 16px;
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .add-phrase-container button:active {
      opacity: 0.8;
    }    

    .card { background: white; padding: 18px; margin-bottom: 12px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); cursor: pointer; }
    .card:active { background: #e0f2fe; }
    .french { font-size: 21px; font-weight: bold; color: #1e3a8a; margin-bottom: 5px; }
    .english { font-size: 16px; color: #64748b; }
  </style>
</head>
<body>

  <h2 id="title" onclick="loadData()">🇫🇷 French Phrases</h2>

  <div class="add-phrase-container">
    <input type="text" id="phraseInput" placeholder="Enter new phrase..." />
    <button id="addBtn" onclick="handleAddPhrase()">Translate & Add</button>
  </div>

  <div id="list">Loading...</div>

  <script>
    let frenchVoice = null;

    function loadVoices() {
      if ('speechSynthesis' in window) {
        let voices = window.speechSynthesis.getVoices();
        
        let frVoices = voices.filter(v => v.lang.startsWith('fr'));
        
        frenchVoice = frVoices.find(v => v.name.includes('Thomas')) || 
                      frVoices.find(v => v.name.includes('Nicolas')) || 
                      frVoices.find(v => v.lang === 'fr-FR') ||
                      frVoices[0];
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    function parseCSVLine(line) {
      let values = [];
      let currentValue = '';
      let insideQuotes = false;

      for (let i = 0; i < line.length; i++) {
        let char = line[i];

        if (char === '"') {
          if (insideQuotes && line[i + 1] === '"') {
            currentValue += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) {
          values.push(currentValue.trim());
          currentValue = '';
        } else {
          currentValue += char;
        }
      }
      values.push(currentValue.trim());
      return values;
    }

    async function loadData() {
  let container = document.getElementById('list');
  container.innerHTML = 'Loading...';

  try {
    // Fetches live JSON directly from your Apps Script URL
    const response = await fetch('https://script.google.com/macros/s/AKfycbyFm4CMsRhjso3PoojdVf1X3ucuBdiznvcfNrcbEmqrnaoRYkOcn5vWbPOGYjaT4BLy/exec');
    const validCards = await response.json();

    // Reverse to show newest at the top
    validCards.reverse();
    container.innerHTML = '';

    if (validCards.length === 0) {
      container.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">No phrases found. Add one above!</div>';
      return;
    }

    validCards.forEach(item => {
      let card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<div class="french">' + escapeHtml(item.french) + '</div><div class="english">' + escapeHtml(item.english) + '</div>';
      card.onclick = function() { speakFrench(item.french); };
      container.appendChild(card);
    });

  } catch (err) {
    container.innerHTML = '<div style="text-align: center; color: #ef4444; padding: 20px;">Error loading phrases.</div>';
  }
}

        validCards.reverse();
        container.innerHTML = '';

        validCards.forEach(item => {
          let card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = '<div class="french">' + escapeHtml(item.french) + '</div><div class="english">' + escapeHtml(item.english) + '</div>';
          card.onclick = function() { speakFrench(item.french); };
          container.appendChild(card);
        });

      } catch (err) {
        container.innerHTML = '<div style="text-align: center; color: #ef4444; padding: 20px;">Error loading phrases. Tap title to try again.</div>';
      } finally {
        titleElem.innerHTML = '🇫🇷 French Phrases';
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    async function handleAddPhrase() {
      const input = document.getElementById('phraseInput');
      const phrase = input.value.trim();
      
      if (!phrase) return;

      const btn = document.getElementById('addBtn');
      btn.innerText = 'Adding...';
      btn.disabled = true;

      try {
        // 1. Send phrase to Google Apps Script
        await fetch('https://script.google.com/macros/s/AKfycbyFm4CMsRhjso3PoojdVf1X3ucuBdiznvcfNrcbEmqrnaoRYkOcn5vWbPOGYjaT4BLy/exec', {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phrase: phrase })
        });

        // 2. Clear input & reset button text
        input.value = '';
        btn.innerText = 'Translate & Add';
        btn.disabled = false;

        // 3. OPTIMISTIC UPDATE: Add card immediately to top of screen so it feels instant
        const container = document.getElementById('list');
        const tempCard = document.createElement('div');
        tempCard.className = 'card';
        tempCard.style.opacity = '0.75'; // Soft visual hint while syncing in background
        tempCard.innerHTML = '<div class="french">Syncing translation...</div><div class="english">' + escapeHtml(phrase) + '</div>';
        
        // Insert card at the top
        container.insertBefore(tempCard, container.firstChild);

        // 4. Delay full reload by 4 seconds to allow Google's CSV export cache to catch up
        setTimeout(() => {
          if (typeof loadData === 'function') loadData();
        }, 4000);

      } catch (error) {
        alert('Error adding phrase');
        btn.innerText = 'Translate & Add';
        btn.disabled = false;
      }
    }

    function speakFrench(text) {
      if (!text) return;

      // 1. Send text to Swift AVSpeechSynthesizer if running in native app
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.nativeSpeak) {
        window.webkit.messageHandlers.nativeSpeak.postMessage(text);
        return;
      }

      // 2. Fallback for regular web browsers
      if (!('speechSynthesis' in window)) return;
      if (!frenchVoice) loadVoices();

      window.speechSynthesis.cancel();
      let utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'fr-FR';
      utterance.rate = 0.88;
      utterance.pitch = 0.95;

      if (frenchVoice) {
        utterance.voice = frenchVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    loadData();
  </script>
</body>
</html>
