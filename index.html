<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>French Phrases</title>
  
  <script src="config.js"></script>

  <style>
    body { font-family: -apple-system, sans-serif; padding: 15px; background: #f4f4f9; margin: 0; }
    
    h2 { 
      text-align: center; 
      color: #333; 
      font-size: 26px; 
      margin-top: 10px; 
      margin-bottom: 20px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s ease;
    }
    h2:active { opacity: 0.5; }

    .card { background: white; padding: 18px; margin-bottom: 12px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); cursor: pointer; }
    .card:active { background: #e0f2fe; }
    .french { font-size: 21px; font-weight: bold; color: #1e3a8a; margin-bottom: 5px; }
    .english { font-size: 16px; color: #64748b; }
  </style>
</head>
<body>

  <h2 id="title" onclick="loadData()">🇫🇷 French Phrases</h2>

  <div id="list">Loading...</div>

  <script>
    let currentAudio = null;

    function parseCSVLine(line) {
      let values = [];
      let currentValue = '';
      let insideQuotes = false;

      for (let i = 0; i < line.length; i++) {
        let char = line[i];

        if (char === '"') {
          if (insideQuotes && line[i + 1] === '"') {
            currentValue += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) {
          values.push(currentValue.trim());
          currentValue = '';
        } else {
          currentValue += char;
        }
      }
      values.push(currentValue.trim());
      return values;
    }

    async function loadData() {
      let titleElem = document.getElementById('title');
      let container = document.getElementById('list');

      titleElem.innerHTML = '🔄 Updating...';

      try {
        const freshUrl = SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
        const response = await fetch(freshUrl);
        if (!response.ok) throw new Error('Network response failed');
        
        const text = await response.text();
        const lines = text.split(/\r?\n/);
        
        let validCards = [];

        for (let i = 1; i < lines.length; i++) {
          let line = lines[i].trim();
          if (!line) continue;
          
          let cols = parseCSVLine(line);
          let english = cols[1] ? cols[1].replace(/^"|"$/g, '').trim() : '';
          let french = cols[2] ? cols[2].replace(/^"|"$/g, '').trim() : '';
          let audioUrl = cols[3] ? cols[3].replace(/^"|"$/g, '').trim() : '';

          if (french || english) {
            validCards.push({ french, english, audioUrl });
          }
        }

        validCards.reverse();
        container.innerHTML = '';

        validCards.forEach(item => {
          let card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = '<div class="french">' + escapeHtml(item.french) + '</div><div class="english">' + escapeHtml(item.english) + '</div>';
          card.onclick = function() { playAudio(item.french, item.audioUrl); };
          container.appendChild(card);
        });

      } catch (err) {
        container.innerHTML = '<div style="text-align: center; color: #ef4444; padding: 20px;">Error loading phrases. Tap title to try again.</div>';
      } finally {
        titleElem.innerHTML = '🇫🇷 French Phrases';
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function playAudio(frenchText, audioUrl) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      // 1. Use direct MP3 link from Google Drive if present in Column D
      // 2. Fallback to Google Translate instant audio stream if Column D is empty
      let targetUrl = audioUrl;
      if (!targetUrl && frenchText) {
        targetUrl = 'https://translate.google.com/translate_tts?ie=UTF-8&tl=fr&client=tw-ob&q=' + encodeURIComponent(frenchText);
      }

      if (targetUrl) {
        currentAudio = new Audio(targetUrl);
        currentAudio.play().catch(err => console.log('Audio playback error:', err));
      }
    }

    loadData();
  </script>
</body>
</html>
