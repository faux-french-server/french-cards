<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>French Phrases</title>

  <style>
    body { font-family: -apple-system, sans-serif; padding: 0 15px 15px 15px; background: #f4f4f9; margin: 0; color: #333; }
    
    /* Fixed Top Header Container */
    .sticky-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background-color: #f4f4f9;
      padding-top: calc(env(safe-area-inset-top, 20px) + 10px);
      padding-bottom: 12px;
      padding-left: 15px;
      padding-right: 15px;
      z-index: 1000;
      border-bottom: 1px solid #cbd5e1;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    /* Top Row: Title + Sync */
    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    h2 { 
      color: #333; 
      font-size: 24px; 
      margin: 0;
      user-select: none;
      white-space: nowrap;
    }

    /* Sub Row: Filter + Study Mode */
    .header-sub-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .category-filter-select {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 18px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      text-transform: capitalize;
    }

    .sync-btn {
      background: #e2e8f0;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, background-color 0.2s ease;
      color: #475569;
      padding: 0;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .sync-btn:active {
      transform: scale(0.9);
      background: #cbd5e1;
    }

    .sync-btn svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    /* Study Mode Toggle Button */
    .study-btn {
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
      border-radius: 18px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .study-btn.active {
      background: #007aff;
      color: white;
      border-color: #007aff;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .spinning {
      animation: spin 0.8s linear infinite;
    }

    .add-phrase-container {
      display: flex;
      gap: 8px;
      justify-content: center;
      max-width: 500px;
      margin: 0 auto;
    }

    .add-phrase-container input, .modal-input {
      flex: 1;
      min-width: 0;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      background: #ffffff;
      color: #1e293b;
      box-sizing: border-box;
    }

    .modal-input {
      width: 100%;
      margin-bottom: 15px;
    }

    .add-phrase-container button {
      padding: 10px 16px;
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .add-phrase-container button:active {
      opacity: 0.8;
    }    

    #list {
      overflow: hidden;
      padding-top: calc(env(safe-area-inset-top, 20px) + 155px);
      position: relative;
    }

    .card { 
      position: relative;
      background: white; 
      padding: 18px;
      padding-bottom: 20px;
      margin-bottom: 12px; 
      border-radius: 12px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.08); 
      touch-action: pan-y;
      will-change: transform;
      z-index: 1;
      transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    .card.dragging-active {
      opacity: 0.3 !important;
      border: 2px dashed #007aff;
    }

    .card-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 3000;
      opacity: 0.9;
      box-shadow: 0 12px 28px rgba(0,0,0,0.25) !important;
      transform: scale(1.02);
      transition: none !important;
    }

    /* Interactive Category Pill Badge */
    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: 12px;
      margin-bottom: 8px;
      background: #e2e8f0;
      color: #475569;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0.05);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .category-badge::after {
      content: '▾';
      font-size: 10px;
      margin-left: 2px;
    }

    .category-badge:active {
      transform: scale(0.95);
      opacity: 0.8;
    }

    /* Revealed state styling in Study Mode */
    .card.study-revealed {
      cursor: pointer;
      border: 1px dashed #007aff;
    }

    /* Study Mode Card Styling (Hidden State) */
    .card.study-card {
      border: 2px dashed #cbd5e1;
      background: #f8fafc;
      text-align: center;
      padding: 24px 18px;
    }

    .card.study-card .english-prompt {
      font-size: 18px;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
      display: inline-block;
      padding: 6px 12px;
      border-radius: 8px;
      -webkit-tap-highlight-color: rgba(0, 122, 255, 0.1);
      transition: background-color 0.15s ease;
    }

    .card.study-card .english-prompt:active {
      background-color: #e2e8f0;
    }

    .card.study-card .tap-hint {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
      pointer-events: none;
    }

    .card.animating {
      transition: transform 0.25s ease-out, opacity 0.25s ease-out;
    }

    .translation-row {
      margin-bottom: 10px;
    }

    .translation-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 2px;
    }

    .french { 
      font-size: 19px; 
      font-weight: bold; 
      color: #1e3a8a; 
      cursor: pointer;
      display: inline-block;
      -webkit-tap-highlight-color: rgba(30, 58, 138, 0.1);
    }

    .french.slang-text {
      color: #0284c7;
    }

    .french:active {
      opacity: 0.7;
    }

    .english { font-size: 15px; color: #64748b; margin-top: 4px; user-select: none; }

    .delete-btn {
      display: block;
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      font-size: 22px;
      color: #94a3b8;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
      border-radius: 50%;
      transition: color 0.2s ease, background-color 0.2s ease;
      z-index: 10;
    }

    .delete-btn:hover {
      color: #ef4444;
      background-color: #fee2e2;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      font-size: 13px;
      cursor: pointer;
      padding: 4px 8px;
      margin-left: 4px;
      line-height: 1;
      vertical-align: middle;
      transition: transform 0.15s ease, background-color 0.2s ease, color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      color: #334155;
    }

    .action-btn svg {
      width: 15px;
      height: 15px;
      display: block;
    }

    .action-btn:hover {
      background-color: #e2e8f0;
    }

    .action-btn:active {
      transform: scale(0.9);
      background-color: #cbd5e1;
    }

    .action-btn.copied {
      background-color: #dcfce7;
      border-color: #86efac;
      color: #166534;
      font-weight: bold;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: white;
      border-radius: 14px;
      padding: 20px;
      width: 80%;
      max-width: 300px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      transform: scale(0.9);
      transition: transform 0.2s ease;
    }

    .modal-overlay.active .modal-box {
      transform: scale(1);
    }

    .modal-title {
      font-size: 17px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .modal-message {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 15px;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
    }

    .modal-btn {
      flex: 1;
      padding: 10px 0;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .modal-btn-cancel {
      background: #f1f5f9;
      color: #475569;
    }

    .modal-btn-confirm {
      background: #007aff;
      color: white;
    }

    .modal-btn-delete {
      background: #ef4444;
      color: white;
    }

    /* Category Picker Modal Options */
    .category-picker-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 15px;
      max-height: 250px;
      overflow-y: auto;
    }

    .category-option-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      font-size: 15px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      text-transform: capitalize;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: background-color 0.15s ease;
    }

    .category-option-btn .color-indicator {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1.5px solid rgba(0,0,0,0.15);
      display: inline-block;
      flex-shrink: 0;
    }

    .category-option-btn.add-new-btn {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #1d4ed8;
      justify-content: center;
    }

    .category-option-btn:active {
      background: #e2e8f0;
    }

    /* Color Selection Row inside New Category Modal */
    .color-picker-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      padding: 0 5px;
    }

    .color-picker-label {
      font-size: 14px;
      color: #475569;
      font-weight: 600;
    }

    .color-picker-input {
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
      padding: 0;
    }

    body.is-native-app .delete-btn {
      display: none !important;
    }

    /* Automatic Dark Mode Styles */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0f172a;
        color: #f8fafc;
      }

      .sticky-header {
        background-color: #0f172a;
        border-bottom-color: #334155;
      }

      h2 {
        color: #f8fafc;
      }

      .category-filter-select {
        background: #1e293b;
        border-color: #334155;
        color: #cbd5e1;
      }

      .sync-btn {
        background: #1e293b;
        color: #94a3b8;
      }

      .sync-btn:active {
        background: #334155;
      }

      .study-btn {
        background: #1e293b;
        border-color: #334155;
        color: #cbd5e1;
      }

      .study-btn.active {
        background: #007aff;
        color: white;
        border-color: #007aff;
      }

      .add-phrase-container input, .modal-input {
        background: #1e293b;
        border-color: #334155;
        color: #f8fafc;
      }

      .add-phrase-container input::placeholder, .modal-input::placeholder {
        color: #64748b;
      }

      .card {
        background: #1e293b;
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      }

      .card.study-card {
        background: #1e293b;
        border-color: #334155;
      }

      .card.study-revealed {
        border-color: #38bdf8;
      }

      .card.study-card .english-prompt {
        color: #f8fafc;
      }

      .card.study-card .english-prompt:active {
        background-color: #334155;
      }

      .card.study-card .tap-hint {
        color: #64748b;
      }

      .translation-label {
        color: #64748b;
      }

      .french {
        color: #60a5fa;
      }

      .french.slang-text {
        color: #38bdf8;
      }

      .english {
        color: #94a3b8;
      }

      .action-btn {
        background: #334155;
        border-color: #475569;
        color: #cbd5e1;
      }

      .action-btn:hover {
        background-color: #475569;
      }

      .action-btn:active {
        background-color: #64748b;
      }

      .action-btn.copied {
        background-color: #064e3b;
        border-color: #059669;
        color: #a7f3d0;
      }

      .delete-btn {
        color: #64748b;
      }

      .delete-btn:hover {
        color: #f87171;
        background-color: #450a0a;
      }

      .modal-box {
        background: #1e293b;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      }

      .modal-title {
        color: #f8fafc;
      }

      .modal-message {
        color: #94a3b8;
      }

      .modal-btn-cancel {
        background: #334155;
        color: #cbd5e1;
      }

      .category-option-btn {
        background: #334155;
        border-color: #475569;
        color: #f8fafc;
      }

      .category-option-btn.add-new-btn {
        background: #1e3a8a;
        border-color: #3b82f6;
        color: #bfdbfe;
      }

      .category-option-btn:active {
        background: #475569;
      }

      .color-picker-label {
        color: #cbd5e1;
      }
    }
  </style>
</head>
<body>

  <!-- Fixed Top Header Container -->
  <div class="sticky-header">
    <div class="header-top-row">
      <h2>🇫🇷 French Phrases</h2>
      <button class="sync-btn" id="syncBtn" onclick="syncWithCloud()" title="Sync from Google Sheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6"></path>
          <path d="M2.5 22v-6h6"></path>
          <path d="M2 11.5a10 10 0 0 1 18.8-4.3L21.5 8"></path>
          <path d="M22 12.5a10 10 0 0 1-18.8 4.2L2.5 16"></path>
        </svg>
      </button>
    </div>

    <div class="header-sub-row">
      <select class="category-filter-select" id="categoryFilter" onchange="filterByCategory()">
        <option value="all">All Categories</option>
      </select>

      <button class="study-btn" id="studyBtn" onclick="toggleStudyMode()">
        <span>🎴</span> Study Mode
      </button>
    </div>

    <form class="add-phrase-container" onsubmit="event.preventDefault(); handleAddPhrase();">
      <input type="text" id="phraseInput" placeholder="Enter new phrase..." onkeydown="handleKeyPress(event)" />
      <button type="submit" id="addBtn">Translate</button>
    </form>
  </div>

  <div id="list"></div>

  <!-- Delete Confirm Modal -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-box">
      <div class="modal-title">Delete Phrase</div>
      <div class="modal-message">Are you sure you want to delete this phrase?</div>
      <div class="modal-buttons">
        <button class="modal-btn modal-btn-cancel" onclick="closeConfirmModal(false)">Cancel</button>
        <button class="modal-btn modal-btn-delete" onclick="closeConfirmModal(true)">Delete</button>
      </div>
    </div>
  </div>

  <!-- Category Quick-Picker Modal -->
  <div class="modal-overlay" id="categoryPickerModal" onclick="handleCategoryOverlayClick(event)">
    <div class="modal-box">
      <div class="modal-title">Change Category</div>
      <div class="modal-message">Select a category (press & hold to edit color):</div>
      <div class="category-picker-options" id="categoryPickerOptions"></div>
    </div>
  </div>

  <!-- New Category Input + Color Picker Modal -->
  <div class="modal-overlay" id="newCategoryModal">
    <div class="modal-box">
      <div class="modal-title">New Category</div>
      <div class="modal-message">Choose a name and color:</div>
      <input type="text" class="modal-input" id="newCategoryInput" placeholder="Category name..." />
      
      <div class="color-picker-row">
        <span class="color-picker-label">Badge Color</span>
        <input type="color" class="color-picker-input" id="newCategoryColor" value="#007aff" />
      </div>

      <div class="modal-buttons">
        <button class="modal-btn modal-btn-cancel" onclick="closeNewCategoryModal(false)">Cancel</button>
        <button class="modal-btn modal-btn-confirm" onclick="closeNewCategoryModal(true)">Create</button>
      </div>
    </div>
  </div>

  <!-- Edit Category Color Modal -->
  <div class="modal-overlay" id="editCategoryColorModal">
    <div class="modal-box">
      <div class="modal-title" id="editCategoryColorTitle">Edit Color</div>
      <div class="modal-message">Select a new pill color for all phrases in this category:</div>
      
      <div class="color-picker-row">
        <span class="color-picker-label">Badge Color</span>
        <input type="color" class="color-picker-input" id="editCategoryColorPicker" value="#007aff" />
      </div>

      <div class="modal-buttons">
        <button class="modal-btn modal-btn-cancel" onclick="closeEditCategoryColorModal(false)">Cancel</button>
        <button class="modal-btn modal-btn-confirm" onclick="closeEditCategoryColorModal(true)">Save</button>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyFm4CMsRhjso3PoojdVf1X3ucuBdiznvcfNrcbEmqrnaoRYkOcn5vWbPOGYjaT4BLy/exec';
    let frenchVoice = null;
    let localPhrases = [];
    let categoryColors = {}; // Maps category name -> hex color
    let pendingDeleteIndex = null;
    let pendingDeleteCard = null;
    let activeCategoryChangeIndex = null;
    let targetCategoryForColorEdit = null;

    let isStudyMode = false;
    let revealedCardIndices = new Set();
    let currentCategoryFilter = 'all';

    // Fallback theme colors for standard default categories
    const defaultCategoryColors = {
      'morning': '#22c55e',
      'evening': '#e0e7ff',
      'other': '#f1f5f9'
    };

    const copyIconSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"></path><rect x="9" y="9" width="12" height="12" rx="2" ry="2"></rect></svg>`;

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    function checkEnvironment() {
      const isNativeApp = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.nativeSpeak);
      if (isNativeApp) {
        document.body.classList.add('is-native-app');
      }
    }
    checkEnvironment();

    // Map existing category colors from localPhrases and standard fallbacks
    function buildCategoryColorMap() {
      localPhrases.forEach(item => {
        const cat = (item.category || '').trim().toLowerCase();
        if (cat) {
          if (item.color) {
            categoryColors[cat] = item.color;
          } else if (!categoryColors[cat] && defaultCategoryColors[cat]) {
            categoryColors[cat] = defaultCategoryColors[cat];
          }
        }
      });
    }

    function getActiveCategories() {
      const activeCats = new Set();
      localPhrases.forEach(item => {
        const cat = (item.category || '').trim().toLowerCase();
        if (cat) activeCats.add(cat);
      });
      return Array.from(activeCats).sort();
    }

    function updateCategoryDropdowns() {
      buildCategoryColorMap();
      const activeCategories = getActiveCategories();

      const select = document.getElementById('categoryFilter');
      const previousSelected = currentCategoryFilter;
      select.innerHTML = '<option value="all">All Categories</option>';
      
      activeCategories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
        select.appendChild(option);
      });

      if (activeCategories.includes(previousSelected)) {
        select.value = previousSelected;
      } else {
        currentCategoryFilter = 'all';
        select.value = 'all';
      }

      const optionsContainer = document.getElementById('categoryPickerOptions');
      optionsContainer.innerHTML = '';

      activeCategories.forEach(cat => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'category-option-btn';
        
        const catColor = categoryColors[cat] || defaultCategoryColors[cat] || '#cbd5e1';
        const colorDot = `<span class="color-indicator" style="background:${catColor}"></span>`;
        
        btn.innerHTML = `<span>${escapeHtml(cat)}</span>${colorDot}`;

        attachCategoryButtonGestures(btn, cat, catColor);

        optionsContainer.appendChild(btn);
      });

      const addNewBtn = document.createElement('button');
      addNewBtn.type = 'button';
      addNewBtn.className = 'category-option-btn add-new-btn';
      addNewBtn.innerHTML = '+ Add New Category...';

    // Attach click and long-press event listeners to category options
    function attachCategoryButtonGestures(btn, categoryName, currentColor) {
      let pressTimer = null;
      let isLongPress = false;

      function triggerHaptic() {
        if (navigator.vibrate) navigator.vibrate(40);
      }

      function startPress() {
        isLongPress = false;
        pressTimer = setTimeout(() => {
          isLongPress = true;
          triggerHaptic();
          openEditCategoryColorModal(categoryName, currentColor);
        }, 500);
      }

      function cancelPress() {
        if (pressTimer) {
          clearTimeout(pressTimer);
          pressTimer = null;
        }
      }

      btn.addEventListener('touchstart', startPress, { passive: true });
      btn.addEventListener('touchend', (e) => {
        cancelPress();
        if (!isLongPress) {
          updateCardCategory(categoryName, currentColor);
        }
      });
      btn.addEventListener('touchmove', cancelPress, { passive: true });

      btn.addEventListener('mousedown', startPress);
      btn.addEventListener('mouseup', () => {
        cancelPress();
        if (!isLongPress) {
          updateCardCategory(categoryName, currentColor);
        }
      });
      btn.addEventListener('mouseleave', cancelPress);
    }

    function getContrastTextColor(hex) {
      if (!hex || !hex.startsWith('#') || hex.length !== 7) return null;
      const r = parseInt(hex.substr(1, 2), 16);
      const g = parseInt(hex.substr(3, 2), 16);
      const b = parseInt(hex.substr(5, 2), 16);
      
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return luminance > 0.6 ? '#0f172a' : '#ffffff';
    }

    function renderCategoryBadge(catName, colorHex) {
      const cleanCat = (catName || 'uncategorized').toLowerCase();
      let styleAttr = '';

      const effectiveColor = colorHex || categoryColors[cleanCat] || defaultCategoryColors[cleanCat];

      if (effectiveColor) {
        const textColor = getContrastTextColor(effectiveColor) || '#0f172a';
        const borderStyle = textColor === '#0f172a' ? 'border: 1px solid rgba(0,0,0,0.1);' : 'border: 1px solid rgba(255,255,255,0.2);';
        styleAttr = `style="background-color: ${effectiveColor}; color: ${textColor}; ${borderStyle}"`;
      }

      return `<span class="category-badge ${cleanCat}" ${styleAttr} onclick="openCategoryPickerModal(event, arguments[0])">${cleanCat}</span>`;
    }

        frenchVoice = frVoices.find(v => v.name.includes('Thomas')) ||

    function renderCards(phrases) {
      updateCategoryDropdowns();

      const container = document.getElementById('list');
      container.innerHTML = '';

      if (!phrases || phrases.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">No phrases saved. Add one above!</div>';
        return;
      }

      const filteredPhrases = phrases.map((item, originalIndex) => ({ ...item, originalIndex }))
        .filter(item => {
          if (currentCategoryFilter === 'all') return true;
          const cat = (item.category || '').toLowerCase();
          return cat === currentCategoryFilter;
        });

      if (filteredPhrases.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">No phrases found in this category.</div>';
        return;
      }

      filteredPhrases.forEach((item) => {
        const index = item.originalIndex;
        let card = document.createElement('div');
        const cat = (item.category || 'uncategorized').toLowerCase();
        const catColor = item.color || categoryColors[cat] || '';
        card.setAttribute('data-index', index);

        if (isStudyMode && !revealedCardIndices.has(index)) {
          card.className = 'card study-card';
          
          let badgeHtml = renderCategoryBadge(cat, catColor).replace('arguments[0]', index);
          let contentHtml = `<button class="delete-btn" onclick="handleWebDelete(event, ${index}, this.parentElement)" title="Delete Phrase">&times;</button>`;
          contentHtml += `
            <div>${badgeHtml}</div>
            <div class="english-prompt" onclick="revealStudyCard(${index}, localPhrases[${index}])">
              ${escapeHtml(item.english)}
            </div>
            <div class="tap-hint">Tap text to reveal & listen 👆</div>
          `;
          
          card.innerHTML = contentHtml;
          attachCardGestures(card, index);
          container.appendChild(card);
          return;
        }

        card.className = 'card' + (isStudyMode ? ' study-revealed' : '');

        if (isStudyMode) {
          card.onclick = (e) => {
            if (!e.target.closest('.delete-btn') && 
                !e.target.closest('.action-btn') && 
                !e.target.closest('.french') &&
                !e.target.closest('.category-badge')) {
              hideStudyCard(index);
            }
          };
        }

        let badgeHtml = renderCategoryBadge(cat, catColor).replace('arguments[0]', index);
        let contentHtml = `<button class="delete-btn" onclick="handleWebDelete(event, ${index}, this.parentElement)" title="Delete Phrase">&times;</button>`;
        contentHtml += `<div>${badgeHtml}</div>`;

        if (item.french) {
          contentHtml += `
            <div class="translation-row">
              <div class="translation-label">Standard</div>
              <div class="french" onclick="handleSpeechClick(event, '${escapeJsQuote(item.french)}', false)">
                ${escapeHtml(item.french)}
              </div>
              <button class="action-btn" onclick="handleSpeechClick(event, '${escapeJsQuote(item.french)}', true)" title="Play slowly">🐢</button>
              <button class="action-btn" onclick="copyToClipboard(event, '${escapeJsQuote(item.french)}', this)" title="Copy to clipboard">${copyIconSvg}</button>
            </div>
          `;
        }

        if (item.slang) {
          contentHtml += `
            <div class="translation-row">
              <div class="translation-label">Slang / Modern</div>
              <div class="french slang-text" onclick="handleSpeechClick(event, '${escapeJsQuote(item.slang)}', false)">
                ${escapeHtml(item.slang)}
              </div>
              <button class="action-btn" onclick="handleSpeechClick(event, '${escapeJsQuote(item.slang)}', true)" title="Play slowly">🐢</button>
              <button class="action-btn" onclick="copyToClipboard(event, '${escapeJsQuote(item.slang)}', this)" title="Copy to clipboard">${copyIconSvg}</button>
            </div>
          `;
        }

        contentHtml += `<div class="english">${escapeHtml(item.english)}</div>`;

        card.innerHTML = contentHtml;

        attachCardGestures(card, index);

        container.appendChild(card);
      });
    }

    function handleSpeechClick(e, text, isSlow) {

    function copyToClipboard(e, text, btnElement) {
      e.stopPropagation();
      
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text);
      } else {
        let textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-999999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand('copy');
        } catch (err) {
          console.error('Fallback copy failed', err);
        }
        document.body.removeChild(textArea);
      }

      btnElement.innerHTML = "✓";
      btnElement.classList.add("copied");

      setTimeout(() => {
        btnElement.innerHTML = copyIconSvg;
        btnElement.classList.remove("copied");
      }, 1500);

    function attachCardGestures(card, index) {
      let startX = 0;
      let startY = 0;
      let currentX = 0;
      let isSwiping = false;

      let longPressTimer = null;
      let isDragging = false;
      let ghostCard = null;
      let dragOffsetY = 0;

      let autoScrollFrame = null;
      let lastTouchY = 0;

      function triggerHaptic() {
        if (navigator.vibrate) navigator.vibrate(40);
      }

      function stopAutoScroll() {
        if (autoScrollFrame) {
          cancelAnimationFrame(autoScrollFrame);
          autoScrollFrame = null;
        }
      }

      function handleAutoScrollAndReorder() {
        if (!isDragging) return;

        const scrollThreshold = 120;
        const maxScrollSpeed = 15;
        const viewportHeight = window.innerHeight;

        let scrollDelta = 0;

        if (lastTouchY < scrollThreshold) {
          const intensity = (scrollThreshold - lastTouchY) / scrollThreshold;
          scrollDelta = -Math.ceil(intensity * maxScrollSpeed);
        } else if (lastTouchY > viewportHeight - scrollThreshold) {
          const intensity = (lastTouchY - (viewportHeight - scrollThreshold)) / scrollThreshold;
          scrollDelta = Math.ceil(intensity * maxScrollSpeed);
        }

        if (scrollDelta !== 0) {
          window.scrollBy(0, scrollDelta);

          if (ghostCard) {
            ghostCard.style.top = (lastTouchY - dragOffsetY) + 'px';
          }
        }

        const container = document.getElementById('list');
        const cards = Array.from(container.querySelectorAll('.card:not(.dragging-active)'));

        let targetCard = null;
        for (let otherCard of cards) {
          const box = otherCard.getBoundingClientRect();
          if (lastTouchY >= box.top && lastTouchY <= box.bottom) {
            targetCard = otherCard;
            break;
          }
        }

        if (targetCard) {
          const box = targetCard.getBoundingClientRect();
          const middleY = box.top + box.height / 2;
          if (lastTouchY < middleY) {
            container.insertBefore(card, targetCard);
          } else {
            container.insertBefore(card, targetCard.nextSibling);
          }
        }

        autoScrollFrame = requestAnimationFrame(handleAutoScrollAndReorder);
      }

      card.addEventListener('touchstart', (e) => {
        if (e.target.closest('.delete-btn') || e.target.closest('.action-btn') || e.target.closest('.category-badge') || e.target.closest('.french') || e.target.closest('.english-prompt')) {
          return;
        }

        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        lastTouchY = touch.clientY;
        isSwiping = false;
        isDragging = false;
        card.classList.remove('animating');

        longPressTimer = setTimeout(() => {
          isDragging = true;
          triggerHaptic();

          card.classList.add('dragging-active');

          const rect = card.getBoundingClientRect();
          dragOffsetY = touch.clientY - rect.top;

          ghostCard = card.cloneNode(true);
          ghostCard.classList.remove('dragging-active');
          ghostCard.classList.add('card-ghost');
          ghostCard.style.width = rect.width + 'px';
          ghostCard.style.left = rect.left + 'px';
          ghostCard.style.top = (touch.clientY - dragOffsetY) + 'px';

          document.body.appendChild(ghostCard);

          stopAutoScroll();
          autoScrollFrame = requestAnimationFrame(handleAutoScrollAndReorder);
        }, 400);

      }, { passive: true });

      card.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        let deltaX = touch.clientX - startX;
        let deltaY = touch.clientY - startY;
        lastTouchY = touch.clientY;

        if (!isDragging && Math.hypot(deltaX, deltaY) > 10) {
          clearTimeout(longPressTimer);
        }

        if (isDragging) {
          e.preventDefault();
          if (ghostCard) {
            ghostCard.style.top = (touch.clientY - dragOffsetY) + 'px';
          }
          return;
        }

        if (!isSwiping && Math.abs(deltaY) > Math.abs(deltaX)) {
          return;
        }

        if (deltaX > 0) {
          isSwiping = true;
          currentX = deltaX;
          card.style.transform = `translateX(${deltaX}px)`;
          card.style.opacity = Math.max(0.2, 1 - (deltaX / 300));
        }
      }, { passive: false });

      card.addEventListener('touchend', (e) => {
        clearTimeout(longPressTimer);
        stopAutoScroll();

        if (isDragging) {
          if (ghostCard) {
            ghostCard.remove();
            ghostCard = null;
          }
          card.classList.remove('dragging-active');
          isDragging = false;

          commitNewOrder();
          return;
        }

        if (e.target.closest('.delete-btn') || e.target.closest('.action-btn') || e.target.closest('.category-badge')) return;

        card.classList.add('animating');

        if (isSwiping && currentX > 110) {
          openConfirmModal(index, card);
        } else {
          card.style.transform = 'translateX(0px)';
          card.style.opacity = '1';
        }

        currentX = 0;
        isSwiping = false;
      });
    }

    async function commitNewOrder() {
      const container = document.getElementById('list');
      const cardNodes = Array.from(container.querySelectorAll('.card'));
      
      const newVisibleIndices = cardNodes.map(c => parseInt(c.getAttribute('data-index')));

      if (currentCategoryFilter === 'all') {
        const newPhrases = newVisibleIndices.map(i => localPhrases[i]);
        localPhrases = newPhrases;
      } else {
        const filteredMap = newVisibleIndices.map(i => localPhrases[i]);
        let filterCounter = 0;

        localPhrases = localPhrases.map(item => {
          const itemCat = (item.category || '').toLowerCase();
          if (itemCat === currentCategoryFilter) {
            return filteredMap[filterCounter++];
          }
          return item;
        });
      }

      saveToLocalStorage(localPhrases);
      renderCards(localPhrases);

      try {
        const orderedEnglishPhrases = localPhrases.map(p => p.english);
        await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'reorder',
            orderedPhrases: orderedEnglishPhrases
          })
        });
      } catch (e) {
        console.error('Failed to sync new order with Google Sheet', e);
      }
    }

    async function deletePhrase(index) {
      const itemToDelete = localPhrases[index];

      localPhrases.splice(index, 1);
      revealedCardIndices.delete(index);
      saveToLocalStorage(localPhrases);
      renderCards(localPhrases);

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'delete',
            english: itemToDelete.english
          })
        });
      } catch (e) {
        console.error('Failed to sync deletion with Google Sheet', e);
      }
    }

    function saveToLocalStorage(phrases) {
      try {
        localStorage.setItem('saved_french_phrases', JSON.stringify(phrases));
      } catch (e) {
        console.error('Could not save to localStorage', e);
      }
    }

    async function initData() {
      checkEnvironment();

      const stored = localStorage.getItem('saved_french_phrases');
      if (stored) {
        try {
          localPhrases = JSON.parse(stored);
          renderCards(localPhrases);
          return;
        } catch (e) {
          console.error('Error parsing local storage');
        }
      }

      syncWithCloud();
    }

    async function syncWithCloud() {
      const syncBtn = document.getElementById('syncBtn');
      syncBtn.classList.add('spinning');

      try {
        const freshUrl = SCRIPT_URL + (SCRIPT_URL.includes('?') ? '&' : '?') + 'cacheBust=' + Date.now();
        const response = await fetch(freshUrl, { method: 'GET', redirect: 'follow' });
        const remoteData = await response.json();

        let phrasesData = [];
        if (Array.isArray(remoteData)) {
          phrasesData = remoteData;
        } else if (remoteData && remoteData.phrases) {
          phrasesData = remoteData.phrases;
        }

        localPhrases = phrasesData.reverse();
        saveToLocalStorage(localPhrases);
        renderCards(localPhrases);

      } catch (err) {
        alert('Could not sync with Google Sheets. Check connection.');
      } finally {
        syncBtn.classList.remove('spinning');
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function escapeJsQuote(str) {
      if (!str) return '';
      return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleAddPhrase();
      }
    }

    async function handleAddPhrase() {
      const input = document.getElementById('phraseInput');
      const phrase = input.value.trim();
      const category = 'other';
      
      if (!phrase) return;

      unlockAudioOnIOS();

      const btn = document.getElementById('addBtn');
      btn.innerText = 'Translating...';
      btn.disabled = true;

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ 
            phrase: phrase,
            category: category 
          })
        });

        const result = await response.json();

        if (result.status === 'success') {
          const newCard = { 
            english: result.english, 
            french: result.french,
            slang: result.slang,
            category: result.category || category,
            color: result.color || ''
          };

          localPhrases.unshift(newCard);
          saveToLocalStorage(localPhrases);

          if (isStudyMode) {
            revealedCardIndices.add(0);
          }

          renderCards(localPhrases);

          input.value = '';

          if (result.french && result.slang) {
            speakFrenchSequence(result.french, result.slang);
          } else if (result.french) {
            speakFrench(result.french, false);
          } else if (result.slang) {
            speakFrench(result.slang, false);
          }

        } else {
          alert('Translation error: ' + (result.message || 'Unknown error'));
        }

      } catch (error) {
        alert('Failed to connect to translation server.');
      } finally {
        btn.innerText = 'Translate';
        btn.disabled = false;
      }
    }

    function speakFrenchSequence(firstText, secondText) {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.nativeSpeak) {
        window.webkit.messageHandlers.nativeSpeak.postMessage("NORMAL|" + firstText);
        
        const speechRateMultiplier = isIOS ? 60 : 50; 
        const estimatedDurationMs = (firstText.length * speechRateMultiplier) + 400;
        
        setTimeout(() => {
          window.webkit.messageHandlers.nativeSpeak.postMessage("NORMAL|" + secondText);
        }, estimatedDurationMs);
        return;
      }

      if (!('speechSynthesis' in window)) return;
      if (!frenchVoice) loadVoices();

      window.speechSynthesis.cancel();

      let utterance1 = new SpeechSynthesisUtterance(firstText);
      utterance1.lang = 'fr-FR';
      utterance1.rate = isIOS ? 0.52 : 0.88;
      if (frenchVoice) utterance1.voice = frenchVoice;

      utterance1.onend = function() {
        setTimeout(() => {
          let utterance2 = new SpeechSynthesisUtterance(secondText);
          utterance2.lang = 'fr-FR';
          utterance2.rate = isIOS ? 0.52 : 0.88;
          if (frenchVoice) utterance2.voice = frenchVoice;
          window.speechSynthesis.speak(utterance2);
        }, 500);
      };

      window.speechSynthesis.speak(utterance1);
    }

    function unlockAudioOnIOS() {
      if ('speechSynthesis' in window && !window.webkit?.messageHandlers?.nativeSpeak) {
        let silentUtterance = new SpeechSynthesisUtterance('');
        silentUtterance.volume = 0;
        window.speechSynthesis.speak(silentUtterance);
      }
    }

    function speakFrench(text, isSlow = false) {
      if (!text) return;

      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.nativeSpeak) {
        const payload = (isSlow ? "SLOW|" : "NORMAL|") + text;
        window.webkit.messageHandlers.nativeSpeak.postMessage(payload);
        return;
      }

      if (!('speechSynthesis' in window)) return;
      if (!frenchVoice) loadVoices();

      window.speechSynthesis.cancel();

      let utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'fr-FR';

      if (isIOS) {
        utterance.rate = isSlow ? 0.25 : 0.52;
      } else {
        utterance.rate = isSlow ? 0.5 : 0.88;
      }

      utterance.pitch = 0.95;

      if (frenchVoice) {
        utterance.voice = frenchVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    initData();
  </script>
