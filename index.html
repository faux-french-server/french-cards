<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>French Phrases</title>
  
  <script src="config.js"></script>

  <style>
    body { font-family: -apple-system, sans-serif; padding: 15px; background: #f4f4f9; margin: 0; }
    
    h2 { 
      text-align: center; 
      color: #333; 
      font-size: 26px; 
      margin-top: 10px; 
      margin-bottom: 5px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    h2:active { opacity: 0.5; }

    #voice-debug {
      font-size: 11px;
      color: #0369a1;
      background: #e0f2fe;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 15px;
      word-break: break-all;
    }

    .card { background: white; padding: 18px; margin-bottom: 12px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); cursor: pointer; }
    .card:active { background: #e0f2fe; }
    .french { font-size: 21px; font-weight: bold; color: #1e3a8a; margin-bottom: 5px; }
    .english { font-size: 16px; color: #64748b; }
  </style>
</head>
<body>

  <h2 id="title" onclick="loadData()">🇫🇷 French Phrases</h2>
  <div id="voice-debug">Detecting iOS voices...</div>

  <div id="list">Loading...</div>

  <script>
    let availableVoices = [];

    function updateVoiceList() {
      if (!('speechSynthesis' in window)) return;
      
      let voices = window.speechSynthesis.getVoices();
      let frenchVoices = voices.filter(v => v.lang && v.lang.startsWith('fr'));
      
      let debugBox = document.getElementById('voice-debug');
      if (frenchVoices.length > 0) {
        debugBox.innerHTML = '<strong>Available FR Voices:</strong><br>' + 
          frenchVoices.map(v => v.name + ' (' + v.lang + ')').join('<br>');
      } else {
        debugBox.innerText = 'No French voices exposed by iOS yet. Tap a card once to initialize.';
      }
      
      availableVoices = frenchVoices;
    }

    if (typeof speechSynthesis !== 'undefined') {
      speechSynthesis.onvoiceschanged = updateVoiceList;
      setTimeout(updateVoiceList, 500);
    }

    function parseCSVLine(line) {
      let values = [];
      let currentValue = '';
      let insideQuotes = false;

      for (let i = 0; i < line.length; i++) {
        let char = line[i];

        if (char === '"') {
          if (insideQuotes && line[i + 1] === '"') {
            currentValue += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) {
          values.push(currentValue.trim());
          currentValue = '';
        } else {
          currentValue += char;
        }
      }
      values.push(currentValue.trim());
      return values;
    }

    async function loadData() {
      let titleElem = document.getElementById('title');
      let container = document.getElementById('list');

      titleElem.innerHTML = '🔄 Updating...';

      try {
        const freshUrl = SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
        const response = await fetch(freshUrl);
        if (!response.ok) throw new Error('Network response failed');
        
        const text = await response.text();
        const lines = text.split(/\r?\n/);
        
        let validCards = [];

        for (let i = 1; i < lines.length; i++) {
          let line = lines[i].trim();
          if (!line) continue;
          
          let cols = parseCSVLine(line);
          let english = cols[1] ? cols[1].replace(/^"|"$/g, '').trim() : '';
          let french = cols[2] ? cols[2].replace(/^"|"$/g, '').trim() : '';

          if (french || english) {
            validCards.push({ french, english });
          }
        }

        validCards.reverse();
        container.innerHTML = '';

        validCards.forEach(item => {
          let card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = '<div class="french">' + escapeHtml(item.french) + '</div><div class="english">' + escapeHtml(item.english) + '</div>';
          card.onclick = function() { speak(item.french); };
          container.appendChild(card);
        });

      } catch (err) {
        container.innerHTML = '<div style="text-align: center; color: #ef4444; padding: 20px;">Error loading phrases. Tap title to try again.</div>';
      } finally {
        titleElem.innerHTML = '🇫🇷 French Phrases';
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function speak(text) {
      if (!text || !('speechSynthesis' in window)) return;
      
      window.speechSynthesis.cancel();
      let utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'fr-FR';
      utterance.rate = 0.85;

      updateVoiceList();

      if (availableVoices.length > 0) {
        // Find Thomas or first available French voice
        let selected = availableVoices.find(v => v.name.toLowerCase().includes('thomas')) || availableVoices[0];
        utterance.voice = selected;
      }

      window.speechSynthesis.speak(utterance);
    }

    loadData();
  </script>
</body>
</html>
